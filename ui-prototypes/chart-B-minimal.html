<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>K线效果图 B · 现代极简风</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#0f1419;--panel:#161c23;--border:#232b35;--text:#e8edf2;--dim:#8a96a3;--up:#ef4444;--down:#10b981;--accent:#3b82f6;}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei",sans-serif;}
body{background:var(--bg);color:var(--text);font-size:12px;padding:16px;}
.tag{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--accent);}
.wrap{display:grid;grid-template-columns:1fr 240px;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.left{background:var(--panel);display:flex;flex-direction:column;}
.header{padding:14px 16px 8px;}
.symbol{font-size:18px;font-weight:700;}
.symbol small{color:var(--dim);font-weight:400;margin-left:8px;font-size:12px;}
.price-row{display:flex;align-items:baseline;gap:12px;margin-top:6px;}
.big{font-size:30px;font-weight:700;}
.chg{font-size:14px;}
.toolbar{display:flex;gap:2px;padding:8px 16px;border-bottom:1px solid var(--border);}
.toolbar button{background:transparent;color:var(--dim);border:none;padding:5px 12px;cursor:pointer;border-radius:6px;font-size:12px;}
.toolbar button.on{color:var(--text);background:#232b35;}
.main{height:360px;}
.vol{height:80px;border-top:1px solid var(--border);}
.right{background:var(--panel);padding:14px;}
.sec{margin-bottom:14px;}
.sec h4{font-size:11px;color:var(--dim);font-weight:500;margin-bottom:6px;}
table{width:100%;font-variant-numeric:tabular-nums;}
td{padding:2px 0;} .l{color:var(--dim);} .p{text-align:right;}
.up{color:var(--up);}.down{color:var(--down);}
</style>
</head>
<body>
<div class="tag">方案B · 现代极简风（大留白 / 清爽 / 圆角 / 大字体）</div>
<div class="wrap">
  <div class="left">
    <div class="header">
      <div class="symbol">引力传媒 <small>603598 · 沪A</small></div>
      <div class="price-row">
        <span class="big up">17.24</span>
        <span class="chg up">+0.05</span>
        <span class="chg up">+0.29%</span>
      </div>
    </div>
    <div class="toolbar">
      <button class="on">分时</button><button>日K</button><button>周K</button>
      <button style="margin-left:12px;">MA</button><button>MACD</button><button>KDJ</button>
    </div>
    <div class="main" id="m"></div>
    <div class="vol" id="v"></div>
  </div>
  <div class="right">
    <div class="sec">
      <h4>今日概览</h4>
      <table>
        <tr><td class="l">今开</td><td class="p">17.15</td></tr>
        <tr><td class="l">最高</td><td class="p up">17.30</td></tr>
        <tr><td class="l">最低</td><td class="p down">17.12</td></tr>
        <tr><td class="l">昨收</td><td class="p">17.19</td></tr>
        <tr><td class="l">成交额</td><td class="p">1.63亿</td></tr>
        <tr><td class="l">换手率</td><td class="p">5.76%</td></tr>
      </table>
    </div>
    <div class="sec">
      <h4>五档</h4>
      <table>
        <tr><td class="l">卖5</td><td class="p up">17.29</td></tr>
        <tr><td class="l">卖1</td><td class="p up">17.25</td></tr>
        <tr><td class="l">买1</td><td class="p down">17.24</td></tr>
        <tr><td class="l">买5</td><td class="p down">17.20</td></tr>
      </table>
    </div>
  </div>
</div>
<script>
(function(){
  const days=[],ohlc=[];let p=16.5;
  for(let i=0;i=0;i++){const d=new Date();d.setDate(d.getDate()-(60-i));days.push((d.getMonth()+1)+"/"+d.getDate());const o=p,c=p+(Math.random()-0.48)*0.3,h=Math.max(o,c)+Math.random()*0.1,l=Math.min(o,c)-Math.random()*0.1;ohlc.push([o,c,h,l]);p=c;}
  const m=echarts.init(document.getElementById("m"));
  m.setOption({backgroundColor:"transparent",grid:{left:50,right:60,top:20,bottom:20},
    xAxis:{type:"category",data:days,axisLine:{lineStyle:{color:"#232b35"}},axisLabel:{color:"#8a96a3",fontSize:10}},
    yAxis:{scale:true,position:"right",splitLine:{lineStyle:{color:"#1a2028"}},axisLabel:{color:"#8a96a3",fontSize:10}},
    series:[{type:"candlestick",data:ohlc,itemStyle:{color:"#ef4444",color0:"#10b981",borderColor:"#ef4444",borderColor0:"#10b981"}}]});
  const v=echarts.init(document.getElementById("v"));
  v.setOption({grid:{left:50,right:60,top:6,bottom:20},xAxis:{type:"category",data:days,axisLabel:{show:false}},yAxis:{splitNumber:2,axisLabel:{color:"#8a96a3",fontSize:10}},series:[{type:"bar",data:ohlc.map(x=>Math.random()*5000),itemStyle:{color:"#3b82f6"}}]});
  window.addEventListener("resize",()=>{m.resize();v.resize();});
})();
</script>
</body>
</html>
