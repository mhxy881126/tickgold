}

  --tx:#1a1d22; --tx2:#5d6670; --tx3:#98a0aa;
  --up:#e60e1e; --dn:#00a35c; --flat:#6b7280;
  --sel:#2f72d6; --selTx:#ffffff;
  --ma1:#d9a400; --ma2:#d628a8; --ma3:#0088c4; --ma4:#7a3fd0; --ma5:#e06a00;
  --grid:#e4e7eb; --toolbar:#e7e9ed; --accent:#c8102e;
  --radius:2px; --frame-glow:none; --chart-bg:#fbfcfe;
}
body[data-theme="ths4"]{ /* 酒红金融 */

  --tx:#e9d6d6; --tx2:#a6848a; --tx3:#75585d;

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC",Segoe UI,system-ui,sans-serif;
  background:var(--bg); color:var(--tx); overflow:hidden; font-size:12px;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;flex-direction:column;height:100vh;gap:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 主题切换器 ============ */
.switcher{
  position:fixed;top:10px;right:14px;z-index:99;display:flex;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
}
.switcher b{font-size:11px;color:var(--tx2);align-self:center;padding:0 4px 0 6px;font-weight:400}
.sw-btn{border:1px solid var(--line);background:var(--panel2);color:var(--tx);
  border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
.sw-btn.active{background:var(--accent);color:#1a1206;border-color:transparent;font-weight:700}

/* ============ 顶部菜单栏 ============ */
.menubar{display:flex;align-items:center;gap:0;background:var(--panel2);
  border-bottom:1px solid var(--line);height:30px;padding:0 8px;flex-shrink:0;user-select:none}
.logo{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--up);
  font-size:13px;margin-right:14px;letter-spacing:.5px}
.logo i{width:17px;height:17px;background:var(--up);border-radius:3px;display:inline-flex;
  align-items:center;justify-content:center;color:#ffd84d;font-style:normal;font-size:11px}
.menus{display:flex;height:100%}
.menus span{padding:0 9px;display:flex;align-items:center;height:100%;cursor:pointer;
  color:var(--tx);position:relative}
.menus span:hover,.menus span.on{background:var(--sel);color:var(--selTx)}
.menubar .sp{flex:1}
.mb-user{color:var(--tx2);margin-right:12px;font-size:11px}
.mb-user b{color:var(--up);font-weight:400}
.winctrl{display:flex;gap:2px}
.winctrl i{width:28px;height:30px;display:flex;align-items:center;justify-content:center;
  color:var(--tx2);font-style:normal;cursor:pointer}
.winctrl i:hover{background:var(--sel)}
.winctrl i.x:hover{background:#e81123;color:#fff}

/* ============ 工具栏 ============ */
.toolbar{display:flex;align-items:stretch;gap:0;background:var(--toolbar);
  border-bottom:1px solid var(--line);height:52px;overflow:hidden;flex-shrink:0}
.tb-scroll{display:flex;align-items:stretch;overflow:hidden;flex:1}
.tb-btn{width:47px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;border-right:1px solid var(--line);
  color:var(--tx2);position:relative}
.tb-btn:hover{background:var(--panel2);color:var(--tx)}
.tb-ico{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tb-ico svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-btn small{font-size:9.5px;line-height:1;white-space:nowrap;transform:scale(.92)}
.tb-sep{width:1px;background:var(--line);margin:7px 2px;flex-shrink:0}
.tb-search{display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.tb-search input{width:150px;height:28px;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;color:var(--tx);padding:0 8px;font-size:11px;outline:none}
.tb-search input:focus{border-color:var(--accent)}

/* ============ 三栏布局 ============ */
.layout{flex:1;display:grid;grid-template-columns:300px 1fr 250px;min-height:0}
.col-left,.col-center,.col-right{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.col-left{border-right:1px solid var(--line)}
.col-right{border-left:1px solid var(--line)}
.col-center{background:var(--chart-bg)}
/* 左侧列表 */
.l-block{display:flex;flex-direction:column;min-height:0}
.l-block + .l-block{border-top:1px solid var(--line)}
.l-block.fix{flex:0 0 37%}.l-block.grow{flex:1}
.l-tabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--line);height:24px;flex-shrink:0}
.l-tab{padding:0 9px;display:flex;align-items:center;font-size:11px;color:var(--tx2);cursor:pointer;height:100%}
.l-tab.on{background:var(--sel);color:var(--selTx)}
.l-head,.stock-row{display:grid;grid-template-columns:52px 1fr 50px 50px;gap:3px;padding:0 6px;align-items:center}
.l-head{height:20px;background:var(--panel2);color:var(--tx2);font-size:10.5px;flex-shrink:0}
.l-head span:nth-child(3),.l-head span:nth-child(4){text-align:right}
.l-list{overflow-y:auto;flex:1}
.stock-row{height:21px;cursor:pointer;font-size:11px}
.stock-row:hover{background:var(--panel2)}
.stock-row.sel{background:var(--sel);color:var(--selTx)}
.stock-row code{font-family:Consolas,monospace;color:var(--tx2);font-size:10.5px}
.stock-row.sel code{color:var(--selTx)}
.stock-row i{font-style:normal;font-family:Consolas,monospace;font-size:10.5px;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
/* 中央图表 */
.c-tabs{display:flex;height:25px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;align-items:center}
.c-tab{padding:0 12px;height:100%;display:flex;align-items:center;color:var(--tx2);cursor:pointer;border-right:1px solid var(--line);font-size:11px;position:relative}
.c-tab.on{background:var(--chart-bg);color:var(--tx)}
.c-tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.c-tab .x{margin-left:6px;color:var(--tx3)}
.c-tabs .new{margin-left:auto;color:var(--tx2);cursor:pointer;padding:0 12px}
.chart-box{position:relative;flex:1;min-height:0}
.sub-box{flex:0 0 24%;border-top:1px solid var(--line);position:relative;min-height:0}
.chart-box svg,.sub-box svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.chart-title{position:absolute;left:8px;top:5px;z-index:5;font-size:11px;display:flex;gap:12px;align-items:center;pointer-events:none}
.chart-title b{font-weight:400;color:var(--tx2)}
.chart-title .ma{display:inline-flex;gap:4px;align-items:center;color:var(--tx2)}
.chart-title .ma i{width:10px;height:2px;font-style:normal;display:inline-block}
.chart-ind{position:absolute;left:8px;top:5px;z-index:5;display:flex;gap:9px;font-size:11px}
.chart-ind span{cursor:pointer;color:var(--tx2)}
.chart-ind span.on{color:var(--tx)}
/* 右侧盘口 */
.r-pad{padding:8px 9px;overflow-y:auto;flex:1}
.q-name{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.q-name code{font-size:11px;color:var(--tx2);font-weight:400;font-family:Consolas}
.q-price{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.q-price b{font-size:26px;font-family:Consolas}
.q-price span{font-size:11px}
.q-wb{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);padding:3px 0;border-bottom:1px solid var(--line);margin-bottom:7px}
.q-wb b{color:var(--up);font-weight:400}
.lv5{margin-bottom:8px}
.lv{display:flex;align-items:center;gap:6px;height:18px;font-family:Consolas;font-size:11px}
.lv span.l{width:26px;color:var(--tx2)}
.lv .bar{flex:1;height:13px;border-radius:2px;position:relative;min-width:18px}
.lv .bar i{position:absolute;right:0;top:0;bottom:0;border-radius:2px;opacity:.8}
.lv b{width:58px;text-align:right;font-weight:400}
.lv.sell .bar i{background:var(--dn)}.lv.buy .bar i{background:var(--up)}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;margin-bottom:4px}
.q-grid div{display:flex;justify-content:space-between;padding:1.5px 0}
.q-grid div span{color:var(--tx2)}
.q-grid div b{font-weight:400;font-family:Consolas}
.r-sec-t{font-size:11px;border-left:3px solid var(--accent);padding-left:6px;margin:11px 0 6px}
.chip-row{display:flex;align-items:center;gap:7px;height:16px;font-size:10.5px}
.chip-row span{width:58px;color:var(--tx2)}
.chip-row .track{flex:1;height:9px;background:var(--panel2);border-radius:2px;overflow:hidden}
.chip-row .track i{display:block;height:100%}
.chip-stat{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:7px;font-size:10.5px}
.chip-stat div{display:flex;justify-content:space-between}
.chip-stat span{color:var(--tx2)}.chip-stat b{font-weight:400;font-family:Consolas}
/* 底部状态栏 */
.statusbar{display:flex;align-items:center;height:26px;background:var(--panel2);border-top:1px solid var(--line);flex-shrink:0;font-size:11px}
.st-time{padding:0 12px;color:var(--tx2);border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.st-idx{display:flex;gap:14px;padding:0 12px;border-right:1px solid var(--line);height:100%;align-items:center;font-family:Consolas}
.st-idx b{font-weight:400}
.st-news{flex:1;overflow:hidden;white-space:nowrap;margin:0 12px;color:var(--tx2)}
.st-news b{color:var(--up);font-weight:400;margin-right:5px}
.st-mkt{padding:0 12px;border-left:1px solid var(--line);height:100%;display:flex;align-items:center;gap:10px;color:var(--tx2)}
</style>

function genTime(){
 const p=[];let seed=42;
 const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
 for(let i=0;i<N;i++){
  let v;
  if(i<25) v=27.3+(30.25-27.3)*(i/25);
  else if(i<60) v=30.25-(30.25-28.6)*((i-25)/35);
  else if(i<121) v=28.85+Math.sin(i/7)*0.28;

  else if(i<176) v=30.0-(30.0-25.9)*((i-141)/35);
  else v=25.88+Math.sin(i/5)*0.04;
  v+=(rnd()-.5)*0.10; p.push(v);
 }
 return p;
}

  else {const t=(i-58)/37;c=38.0-(38.0-26.4)*Math.pow(t,.7)+Math.sin(i/3)*0.5;}
  cl.push(c);
 }
 return cl.map((c,i)=>{
  const o=i?cl[i-1]:c-0.2;
  const hi=Math.max(o,c)*(1+((i*13)%9)/420)+0.05;
  const lo=Math.min(o,c)*(1-((i*17)%9)/420)-0.05;
  return [o,c,hi,lo];
 });
}
