<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickGold · 空工作台 5 款设计</title>
<style>
:root{
  --bg:#0a0a0c; --bg-panel:#101013; --bg-card:#141418; --bg-card2:#0e0e12;
  --bg-hover:#1c1c22; --border:#24242a; --border-light:#2e2e36;
  --text:#ececf0; --text-dim:#90909a; --up:#f6485a; --down:#16c98e; --flat:#90909a;
  --accent:#d8d8e0; --accent-2:#f0f0f5; --blue:#6aa0e8; --gold:#d4af37;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; background:#060608; color:var(--text); overflow:hidden;}
body{display:flex; flex-direction:column;}

/* ===== 顶部：方案切换器（仅效果图工具，不属于软件） ===== */
.switcher{
  display:flex; align-items:center; gap:8px; padding:10px 16px;
  background:#0d0d10; border-bottom:1px solid #1d1d22; flex:none;
}
.switcher .tt{font-size:13px; font-weight:700; margin-right:8px; color:var(--gold);}
.sw-btn{
  padding:6px 14px; border-radius:8px; border:1px solid #2a2a30;
  background:transparent; color:var(--text-dim); font-size:12px; cursor:pointer;
  transition:all .15s;
}
.sw-btn:hover{color:var(--text); border-color:#3a3a42;}
.sw-btn.on{background:var(--blue); border-color:var(--blue); color:#fff;}
.sw-hint{margin-left:auto; font-size:11px; color:#666;}

/* ===== 模拟软件窗口（高保真框架） ===== */
.stage{flex:1; min-height:0; padding:14px; display:flex;}
.window{
  flex:1; min-height:0; background:var(--bg); border:1px solid #202026;
  border-radius:12px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
/* 顶栏 */
.w-topbar{height:38px; flex:none; display:flex; align-items:center; gap:14px;
  padding:0 0 0 12px; background:var(--bg-panel); border-bottom:1px solid var(--border);}
.w-brand{font-weight:700; color:var(--text); font-size:14px;}
.w-search{width:210px; height:24px; border:1px solid var(--border); border-radius:6px;
  display:flex; align-items:center; padding:0 9px; font-size:11px; color:#666; background:var(--bg);}
.w-status{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); padding-right:8px;}
.w-ctl{display:flex; align-self:stretch;}
.w-ctl i{width:44px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-style:normal; font-size:13px;}
.w-ctl i:last-child:hover{background:#e23b45; color:#fff;}
/* 指数条 */
.w-idx{height:30px; flex:none; display:flex; align-items:center; gap:26px; padding:0 14px;
  background:var(--bg-panel); border-bottom:1px solid var(--border); font-size:11px;}
.w-idx .nm{color:var(--text-dim); margin-right:5px;}
.w-idx .vl{font-weight:600;}
/* Dock */
.w-dock{height:42px; flex:none; display:flex; align-items:center; gap:2px; padding:0 8px;
  background:var(--bg-panel); border-bottom:1px solid var(--border); overflow:hidden;}
.w-dock .grp{display:flex; align-items:center; gap:2px; padding:0 9px; border-right:1px solid var(--border); height:100%;}
.w-dock .gn{font-size:9px; color:#666; margin-right:5px;}
.w-dock .di{display:flex; align-items:center; gap:4px; padding:4px 7px; border-radius:8px;
  font-size:11px; color:var(--text-dim);}
/* 工作区外壳 */
.w-workspace{flex:1; min-height:0; position:relative; overflow:hidden;}
.w-time{height:34px; flex:none; display:flex; align-items:center; gap:14px; padding:0 16px;
  border-bottom:1px solid var(--border); font-size:11px;}
.w-time .tab{color:var(--text-dim);}
.w-time .tab.on{color:var(--text); font-weight:600;}
.w-time .clock{margin-left:auto; color:var(--blue); font-weight:600;}
.ws{position:absolute; top:34px; left:0; right:0; bottom:0;}

/* 通用空态元素 */
.tg-logo{width:64px; height:64px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:700; color:#1a1a1a; background:linear-gradient(135deg,#e8c66a,#c8992e);
  box-shadow:0 8px 28px rgba(212,175,55,.4);}
.ghost-btn{padding:9px 22px; border-radius:8px; font-size:13px; cursor:pointer;
  background:var(--bg-panel); border:1px solid var(--border); color:var(--text);}
.ghost-btn.primary{background:var(--blue); border-color:var(--blue); color:#fff;}
.grid-mask{
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:38px 38px;
  -webkit-mask-image:radial-gradient(620px 380px at 50% 46%,#000 25%,transparent 72%);
  mask-image:radial-gradient(620px 380px at 50% 46%,#000 25%,transparent 72%);
}
.scene{display:none; position:absolute; inset:0;}
.scene.on{display:block;}
</style>
</head>
<body>
<div class="switcher">
  <span class="tt">TickGold 空工作台</span>
  <button class="sw-btn on" data-s="1">① 沉浸铺满</button>
  <button class="sw-btn" data-s="2">② 内嵌面板</button>
  <button class="sw-btn" data-s="3">③ Bento 占位骨架</button>
  <button class="sw-btn" data-s="4">④ 边缘光晕</button>
  <button class="sw-btn" data-s="5">⑤ 指挥中枢</button>
  <span class="sw-hint">点击切换 · 均为深色无白边</span>
</div>

<div class="stage">
  <div class="window">
    <div class="w-topbar">
      <span class="w-brand">TickGold</span>
      <span class="w-search">搜索代码 / 名称 / 拼音</span>
      <span class="w-status"><span>● 实时</span><span>|</span><span>9 只</span><span>|</span><span>13:20</span><span>|</span><span>v0.25.0</span></span>
      <span class="w-ctl"><i>—</i><i>□</i><i>✕</i></span>
    </div>
    <div class="w-idx">
      <span><span class="nm">上证指数</span><span class="vl" style="color:var(--down)">3940.54</span><span style="color:var(--down)"> -0.29%</span></span>
      <span><span class="nm">深证成指</span><span class="vl" style="color:var(--down)">13652.56</span><span style="color:var(--down)"> -0.52%</span></span>
      <span><span class="nm">创业板指</span><span class="vl" style="color:var(--down)">3385.10</span><span style="color:var(--down)"> -0.83%</span></span>
      <span><span class="nm">沪深300</span><span class="vl" style="color:var(--down)">4522.33</span><span style="color:var(--down)"> -0.49%</span></span>
      <span><span class="nm">科创50</span><span class="vl" style="color:var(--up)">1665.69</span><span style="color:var(--up)"> +0.04%</span></span>
    </div>
    <div class="w-dock">
      <div class="grp"><span class="gn">总览</span><span class="di">★ 自选</span><span class="di">☰ 榜单</span><span class="di">∿ 宽度</span></div>
      <div class="grp"><span class="gn">盯盘</span><span class="di">◎ 雷达</span><span class="di">⚡ 精灵</span><span class="di">🔔 预警</span></div>
      <div class="grp"><span class="gn">板块</span><span class="di">▦ 板块</span><span class="di">▦ 热力图</span></div>
      <div class="grp"><span class="gn">行情</span><span class="di">📈 K线</span><span class="di">▤ 盘口</span><span class="di">¥ 资金</span></div>
    </div>
    <div class="w-workspace">
      <div class="w-time">
        <span class="tab">集合竞价</span><span class="tab">早盘 9:30</span>
        <span class="tab on">午盘</span><span class="tab">尾盘 14:30</span><span class="tab">盘后复盘</span>
        <span class="clock">午盘 · 9/23 周三 13:20:52</span>
      </div>
      <div class="ws" id="ws"></div>
    </div>
  </div>
</div>
<script>
const ws = document.getElementById('ws');
const style = document.createElement('style');
style.textContent = `
.s1{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(900px 480px at 50% -20%, rgba(212,175,55,.13), transparent 60%),
   radial-gradient(800px 460px at 50% 120%, rgba(106,160,232,.13), transparent 60%), var(--bg);}
.s1 .grid-mask{position:absolute; inset:0;}
.s1 .in{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;}
.s1 h1{font-size:22px; margin:18px 0 8px;} .s1 p{font-size:13px; color:var(--text-dim); margin-bottom:26px;}
.s1 .bb{display:flex; gap:12px;}

.s2{position:absolute; inset:0;}
.s2 .panel{position:absolute; inset:12px; border-radius:12px; overflow:hidden; border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(800px 400px at 50% -10%, rgba(212,175,55,.1), transparent 60%),
   radial-gradient(640px 360px at 50% 115%, rgba(106,160,232,.1), transparent 60%), var(--bg-card2);}
.s2 .grid-mask{position:absolute; inset:0;}
.s2 .in{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;}
.s2 h1{font-size:21px; margin:18px 0 8px;} .s2 p{font-size:13px; color:var(--text-dim); margin-bottom:24px;}
.s2 .bb{display:flex; gap:12px;}

.s3{position:absolute; inset:0; padding:14px 16px; display:flex; flex-direction:column;}
.s3 .lead{font-size:13px; color:var(--text-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.s3 .lead b{color:var(--text);}
.s3 .bento{flex:1; display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(3,1fr); gap:12px;}
.ph{border:1px dashed #2e2e36; border-radius:10px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:9px; color:#6a6a74; font-size:12px; background:rgba(255,255,255,.012);
  cursor:pointer; transition:all .16s; position:relative;}
.ph .ic{width:34px; height:34px; border-radius:9px; border:1px solid #2a2a30; display:flex; align-items:center; justify-content:center; font-size:16px;}
.ph:hover{border-color:var(--blue); color:var(--text); background:rgba(106,160,232,.07); transform:translateY(-2px);}
.ph.added{border-style:solid; border-color:var(--down); color:var(--down); background:rgba(22,201,142,.06);}
.ph .plus{position:absolute; top:7px; right:9px; font-size:14px; color:#444;}
.ph:hover .plus{color:var(--blue);}

.s4{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; background:var(--bg);}
.s4::before{content:""; position:absolute; inset:0;
  background:radial-gradient(620px 300px at 50% -12%, rgba(106,160,232,.18), transparent 70%),
   radial-gradient(620px 300px at 50% 112%, rgba(212,175,55,.16), transparent 70%),
   radial-gradient(320px 420px at -6% 50%, rgba(106,160,232,.12), transparent 70%),
   radial-gradient(320px 420px at 106% 50%, rgba(212,175,55,.12), transparent 70%);}
.s4 .grid-mask{position:absolute; inset:0; opacity:.7;}
.s4 .in{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;}
.s4 h1{font-size:22px; margin:18px 0 8px;} .s4 p{font-size:13px; color:var(--text-dim); margin-bottom:26px;}
.s4 .bb{display:flex; gap:12px;}

.s5{position:absolute; inset:0; padding:16px; display:flex; flex-direction:column; gap:14px;}
.s5 .strip{display:flex; gap:10px; flex:none;}
.statc{flex:1; border:1px solid var(--border); border-radius:10px; padding:9px 13px; background:var(--bg-card);}
.statc .lb{font-size:10px; color:var(--text-dim);} .statc .big{font-size:19px; font-weight:700; margin-top:2px;}
.s5 .mid{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:0;}
.s5 .mid h1{font-size:20px; margin:14px 0 4px;} .s5 .mid p{font-size:12px; color:var(--text-dim); margin-bottom:14px;}
.mood{width:340px; height:8px; border-radius:5px; margin:6px 0 2px; position:relative;
  background:linear-gradient(90deg,#16c98e,#888 50%,#f6485a);}
.mood i{position:absolute; top:-4px; width:4px; height:16px; background:#fff; border-radius:2px; left:62%;}
.mood-lb{font-size:10px; color:var(--text-dim);}
.s5 .quick{display:grid; grid-template-columns:repeat(8,1fr); gap:10px; flex:none;}
.qbtn{display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px; border:1px solid var(--border);
  border-radius:10px; background:var(--bg-card); color:var(--text-dim); font-size:11px; cursor:pointer; transition:.15s;}
.qbtn .qi{width:26px; height:26px; border-radius:8px; background:var(--bg-hover); display:flex; align-items:center; justify-content:center; font-size:14px;}
.qbtn:hover{border-color:var(--blue); color:var(--text); transform:translateY(-2px);}
`;
document.head.appendChild(style);

const logo = '<div class="tg-logo">TG</div>';
const btns = '<div class="bb"><button class="ghost-btn primary">专业盯盘</button><button class="ghost-btn">板块模式</button><button class="ghost-btn">选股模式</button><button class="ghost-btn">全屏布局</button></div>';

const scenes = {
1: `<div class="s1"><div class="grid-mask"></div><div class="in">${logo}<h1>TickGold 盯盘工作台</h1><p>从顶部 Dock 打开功能卡片，或选择一个布局模式快速开始</p>${btns}</div></div>`,

2: `<div class="s2"><div class="panel"><div class="grid-mask"></div><div class="in">${logo}<h1>TickGold 盯盘工作台</h1><p>从顶部 Dock 打开功能卡片，或选择一个布局模式快速开始</p>${btns}</div></div></div>`,

3: `<div class="s3"><div class="lead">点击下方占位卡片，<b>开始搭建你的盯盘台</b> · 已选卡片会即时加入工作台</div>
  <div class="bento">
    <div class="ph" style="grid-column:1 / span 6; grid-row:1 / span 3;"><span class="plus">+</span><div class="ic">▦</div>板块热力图</div>
    <div class="ph" style="grid-column:7 / span 3; grid-row:1 / span 2;"><span class="plus">+</span><div class="ic">∿</div>市场宽度</div>
    <div class="ph" style="grid-column:10 / span 3; grid-row:1 / span 2;"><span class="plus">+</span><div class="ic">◎</div>涨停雷达</div>
    <div class="ph" style="grid-column:7 / span 3; grid-row:3;"><span class="plus">+</span><div class="ic">¥</div>资金流向</div>
    <div class="ph" style="grid-column:10 / span 3; grid-row:3;"><span class="plus">+</span><div class="ic">⚡</div>短线精灵</div>
  </div></div>`,

4: `<div class="s4"><div class="grid-mask"></div><div class="in">${logo}<h1>TickGold 盯盘工作台</h1><p>从顶部 Dock 打开功能卡片，或选择一个布局模式快速开始</p>${btns}</div></div>`,

5: `<div class="s5">
  <div class="strip">
    <div class="statc"><div class="lb">上涨</div><div class="big" style="color:var(--up)">1862</div></div>
    <div class="statc"><div class="lb">下跌</div><div class="big" style="color:var(--down)">3024</div></div>
    <div class="statc"><div class="lb">涨停</div><div class="big" style="color:var(--up)">48</div></div>
    <div class="statc"><div class="lb">跌停</div><div class="big" style="color:var(--down)">12</div></div>
    <div class="statc" style="flex:1.6;"><div class="lb">市场情绪 · 偏谨慎</div><div class="mood"><i></i></div></div>
  </div>
  <div class="mid">${logo}<h1>TickGold 盯盘工作台</h1><p>空台也能一眼看全局 · 选择快捷入口直接开始</p></div>
  <div class="quick">
    <div class="qbtn"><span class="qi">◎</span>涨停雷达</div>
    <div class="qbtn"><span class="qi">▦</span>热力图</div>
    <div class="qbtn"><span class="qi">📈</span>K线盘口</div>
    <div class="qbtn"><span class="qi">¥</span>资金流向</div>
    <div class="qbtn"><span class="qi">⚡</span>短线精灵</div>
    <div class="qbtn"><span class="qi">★</span>自选股</div>
    <div class="qbtn"><span class="qi">☰</span>榜单</div>
    <div class="qbtn"><span class="qi">⚙</span>条件选股</div>
  </div></div>`
};

function render(n){
  ws.innerHTML = scenes[n];
  ws.querySelectorAll('.ph').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('added')));
}
document.querySelectorAll('.sw-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sw-btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.s);
}));
render('1');
</script>
</body>
</html>
