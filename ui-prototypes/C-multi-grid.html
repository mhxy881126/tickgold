<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案C · 多股同列盯盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0a0e14; --panel:#11161f; --border:#1e2634;
  --text:#e6edf3; --dim:#7d8a9c; --up:#f23645; --down:#089981; --accent:#2f6fed;
}
*{box-sizing:border-box; margin:0; padding:0; font-family:"Microsoft YaHei",sans-serif;}
body{background:var(--bg); color:var(--text); height:100vh; overflow:hidden; font-size:12px;}
.app{display:grid; grid-template-rows:38px 34px 1fr; grid-template-columns:1fr; height:100vh;}

.topbar{display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--border);}
.logo{font-weight:700; color:var(--accent);}
.idxbar{flex:1; display:flex; gap:20px;}
.idx .n{color:var(--dim); margin-right:4px;}
.toolbar{display:flex; align-items:center; gap:4px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--border);}
.toolbar button{background:transparent; color:var(--dim); border:none; padding:4px 9px; cursor:pointer; border-radius:4px;}
.toolbar button.on{color:var(--text); background:#1f2630;}
.toolbar .sep{color:var(--border); margin:0 4px;}

.grid{display:grid; grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; gap:1px; background:var(--border);}
.cell{background:var(--bg); display:flex; flex-direction:column; min-height:0; overflow:hidden;}
.cell.main{grid-row:1/3;}
.chead{display:flex; justify-content:space-between; align-items:center; padding:4px 10px; border-bottom:1px solid var(--border);}
.chead .nm{font-weight:700;} .chead .cd{color:var(--dim); margin-left:6px; font-weight:400;}
.chead .p{font-weight:700;}
.up{color:var(--up);} .down{color:var(--down);}
.cell .chart{flex:1; min-height:0;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">金睛盯盘 · 多股同列</div>
    <div class="idxbar">
      <span class="idx"><span class="n">上证</span><span class="up">3911.87 +0.94%</span></span>
      <span class="idx"><span class="n">深成</span><span class="up">13640.87 +1.72%</span></span>
      <span class="idx"><span class="n">创业板</span><span class="up">3372.68 +2.25%</span></span>
    </div>
    <span style="color:var(--dim)">09:35:22</span>
  </div>
  <div class="toolbar">
    <button>分时</button><button class="on">1分</button><button>5分</button><button>日K</button>
    <span class="sep">|</span>
    <button>2列</button><button class="on">2×2</button><button>1+3</button><button>4×4</button>
    <span class="sep">|</span>
    <button style="color:var(--dim);">加入自选</button>
  </div>
  <div class="grid">
    <div class="cell main">
      <div class="chead"><div><span class="nm">引力传媒</span><span class="cd">603598</span></div><div class="p up">17.24 +0.29%</div></div>
      <div class="chart" id="m1"></div>
    </div>
    <div class="cell">
      <div class="chead"><div><span class="nm">贵州茅台</span><span class="cd">600519</span></div><div class="p up">1688 +1.24%</div></div>
      <div class="chart" id="m2"></div>
    </div>
    <div class="cell">
      <div class="chead"><div><span class="nm">宁德时代</span><span class="cd">300750</span></div><div class="p up">218.5 +2.10%</div></div>
      <div class="chart" id="m3"></div>
    </div>
  </div>
</div>
<script>
(function(){
  function mk(id, base, drift){
    const xs=[],p=[];let v=base;
    for(let i=0;i<120;i++){const t=9*60+30+i;xs.push(String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"));v+=(Math.random()-0.5+drift)*0.05;p.push(+v.toFixed(2));}
    const c=echarts.init(document.getElementById(id));
    c.setOption({
      backgroundColor:"transparent",
      grid:{left:44,right:50,top:6,bottom:18},
      xAxis:{type:"category",data:xs,axisLabel:{show:false},axisLine:{lineStyle:{color:"#1e2634"}}},
      yAxis:{scale:true,position:"right",splitLine:{lineStyle:{color:"#161d29"}},axisLabel:{color:"#7d8a9c",fontSize:10}},
      series:[{type:"line",data:p,showSymbol:false,lineStyle:{width:1.2,color: drift>=0?"#f23645":"#089981"}}]
    });
    return c;
  }
  const charts=[mk("m1",17.1,0.02),mk("m2",1680,0.03),mk("m3",215,0.04)];
  window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
})();
</script>
</body>
</html>
