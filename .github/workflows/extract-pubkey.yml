name: extract-pubkey
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Extract public key from signing private key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/key.key
          sudo apt-get install -y minisign >/dev/null
          echo "=== EXTRACTED PUBLIC KEY ==="
          PW="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" expect <<'EOF'
          set timeout 20
          spawn minisign -p /tmp/pub.key -s /tmp/key.key
          expect {
            "Password" { send "$env(PW)\r"; exp_continue }
            eof
          }
          EOF
          cat /tmp/pub.key
          echo "=== END ==="
