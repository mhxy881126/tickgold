name: release

# 推送 v* 标签触发。
# 设计：build 只负责「编译 + 签名 + 产出 bundle」并上传为 artifact，不直接操作 GitHub Release；
#       所有平台构建完成后，由唯一的 publish job 串行「创建唯一 Release → 上传全部资产 → 生成 latest.json」，
#       彻底避免并行 tauri-action 共享 Release 造成的多草稿 / Release 丢失问题。

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win
            platform: windows-latest
            rust_target: ""
            build_args: "--bundles nsis"
            artifact: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - label: mac-arm
            platform: macos-latest
            rust_target: ""
            build_args: "--bundles app,dmg"
            artifact: |
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/release/bundle/dmg/*.dmg
          - label: mac-x64
            platform: macos-latest
            rust_target: "x86_64-apple-darwin"
            build_args: "--bundles app,dmg --target x86_64-apple-darwin"
            artifact: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Add cross target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build & sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build ${{ matrix.build_args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Release 只发布到公开仓库 tickgold-public；私有仓库只保留触发用的 tag，不创建 Release。
    # 跨仓库发布，内置 GITHUB_TOKEN 无权限，必须用 Secrets.PUBLIC_REPO_TOKEN
    # （有 tickgold-public 仓库 write 权限的 Personal Access Token）。
    # 公开仓库只有官网 / 文档 / 截图 + 二进制 Release，无任何业务源码。
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to tickgold-public (binaries only, no source)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: mhxy881126/tickgold-public
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "== collected files =="
          find dist -type f | sort

          # ---- 汇集到 staging 目录 rel/ 并规整最终文件名 ----
          # artifact 保留了 bundle/macos、bundle/dmg 等子目录，统一用 find 定位，不假设层级。
          mkdir -p rel

          WIN_RAW=$(find dist/win -name '*x64-setup.exe' ! -name '*.sig' | head -n1)
          WIN_RAW_SIG=$(find dist/win -name '*x64-setup.exe.sig' | head -n1)
          cp "$WIN_RAW" "rel/$(basename "$WIN_RAW")"
          cp "$WIN_RAW_SIG" "rel/$(basename "$WIN_RAW_SIG")"

          ARM_RAW=$(find dist/mac-arm -path '*/macos/*' -name '*.app.tar.gz' ! -name '*.sig' | head -n1)
          ARM_RAW_SIG=$(find dist/mac-arm -name '*.app.tar.gz.sig' | head -n1)
          ARM_RAW_DMG=$(find dist/mac-arm -name '*.dmg' | head -n1)
          cp "$ARM_RAW" "rel/TickGold_aarch64.app.tar.gz"
          cp "$ARM_RAW_SIG" "rel/TickGold_aarch64.app.tar.gz.sig"
          cp "$ARM_RAW_DMG" "rel/$(basename "$ARM_RAW_DMG")"

          X64_RAW=$(find dist/mac-x64 -path '*/macos/*' -name '*.app.tar.gz' ! -name '*.sig' | head -n1)
          X64_RAW_SIG=$(find dist/mac-x64 -name '*.app.tar.gz.sig' | head -n1)
          X64_RAW_DMG=$(find dist/mac-x64 -name '*.dmg' | head -n1)
          cp "$X64_RAW" "rel/TickGold_x64.app.tar.gz"
          cp "$X64_RAW_SIG" "rel/TickGold_x64.app.tar.gz.sig"
          cp "$X64_RAW_DMG" "rel/$(basename "$X64_RAW_DMG")"

          echo "== staged =="
          find rel -type f | sort

          WIN_EXE="rel/$(basename "$WIN_RAW")"
          WIN_SIG="rel/$(basename "$WIN_RAW_SIG")"
          ARM_TGZ="rel/TickGold_aarch64.app.tar.gz"
          ARM_SIG="rel/TickGold_aarch64.app.tar.gz.sig"
          X64_TGZ="rel/TickGold_x64.app.tar.gz"
          X64_SIG="rel/TickGold_x64.app.tar.gz.sig"
          ARM_DMG="rel/$(basename "$ARM_RAW_DMG")"
          X64_DMG="rel/$(basename "$X64_RAW_DMG")"

          # 更新清单中的下载 URL 统一指向公开仓库 tickgold-public（应用内自动更新走公开 CDN + 镜像）
          GH_BASE="https://github.com/$PUBLIC_REPO/releases/download/$TAG"

          # ---- 签名 ----
          win_sig=$(cat "$WIN_SIG")
          arm_sig=$(cat "$ARM_SIG")
          x64_sig=$(cat "$X64_SIG")
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # ---- 生成三份扁平清单：直连 / ghproxy / gh-proxy ----
          # 客户端「用哪个镜像拉到清单，就用同一镜像下载安装包」，实现下载源容灾。
          gen_manifest() {
            local P="$1"
            jq -n \
              --arg v "$VERSION" --arg d "$PUBDATE" \
              --arg wu "$P$GH_BASE/$(basename "$WIN_EXE")" --arg ws "$win_sig" \
              --arg mau "$P$GH_BASE/$(basename "$ARM_TGZ")" --arg mas "$arm_sig" \
              --arg mxu "$P$GH_BASE/$(basename "$X64_TGZ")" --arg mxs "$x64_sig" \
              '{ version:$v, notes:"", pub_date:$d,
                 platforms:{ "windows-x86_64":{signature:$ws,url:$wu},
                             "darwin-aarch64":{signature:$mas,url:$mau},
                             "darwin-x86_64":{signature:$mxs,url:$mxu} } }'
          }
          gen_manifest ""                     > rel/latest.json
          gen_manifest "https://ghproxy.net/" > rel/latest.ghproxy.json
          gen_manifest "https://gh-proxy.com/" > rel/latest.gh-proxy.json

          # ---- 发布说明（放在 rel/ 外，避免被当成资产上传）----
          cat > body.md <<EOF
          ## TickGold $TAG

          跨平台 A 股盯盘终端，本 Release 由 CI 自动构建并发布到公开仓库。

          > **本 Release 仅包含二进制安装包与签名文件，不包含应用业务源码。** 应用源码在私有仓库维护，本仓库仅含官网 / 文档 / 截图。

          ### 安装包
          - Windows：$(basename "$WIN_EXE")
          - macOS（Apple 芯片）：$(basename "$ARM_DMG")
          - macOS（Intel）：$(basename "$X64_DMG")

          ### 更新机制
          应用内检查更新与下载已内置多镜像容灾（ghproxy / gh-proxy / 官方直连），国内网络可正常升级；安装包均带 minisign 签名校验。
          EOF
          sed -i 's/^          //' body.md

          # ---- 在公开仓库创建/复用唯一 Release → 清旧资产 → 上传 → 解除草稿 ----
          EXISTING=$(gh api "repos/$PUBLIC_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            RID="$EXISTING"; echo "reuse release $RID"
          else
            RID=$(gh api -X POST "repos/$PUBLIC_REPO/releases" \
              -f tag_name="$TAG" -f name="TickGold $TAG" \
              -F draft=true -F prerelease=false --jq ".id")
            echo "created release $RID"
          fi
          # 清空可能残留的同名旧资产，保证幂等
          for AID in $(gh api "repos/$PUBLIC_REPO/releases/$RID/assets" \
              --jq ".[] | .id"); do
            gh api "repos/$PUBLIC_REPO/releases/assets/$AID" -X DELETE >/dev/null 2>&1 || true
          done
          # 二进制安装包 + 签名 + 更新清单（不含任何源码）
          gh release upload "$TAG" rel/* --repo "$PUBLIC_REPO" --clobber
          # 资产就位后解除草稿、正式发布
          gh api -X PATCH "repos/$PUBLIC_REPO/releases/$RID" \
            -F draft=false -F prerelease=false -f name="TickGold $TAG" \
            -f body="$(cat body.md)" --jq '.html_url'
          echo "::notice::Published $TAG to $PUBLIC_REPO with all assets (binaries only, no source)."
