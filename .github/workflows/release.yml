name: release

# 推送 v* 标签时触发：自动在 Windows 与 macOS 两台 runner 上打包、签名、上传到 Release。
# 用法：
#   1. 在仓库 Settings → Secrets and variables → Actions 配置三个 secret：
#      - TAURI_SIGNING_PRIVATE_KEY       （私钥文件 stockdock.key 的完整内容）
#      - TAURI_SIGNING_PRIVATE_KEY_PASSWORD（私钥密码）
#      - GITHUB_TOKEN 已由 Actions 自动注入，无需手动加
#   2. 打标签并推送：git tag v0.1.2 && git push origin v0.1.2
#   3. 两个 job 跑完后，到 Releases 页把草稿 Release 发布；客户端即可"检查更新"。

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x64
            target: nsis
            rust_target: ""
          - platform: macos-latest # Apple Silicon 原生
            arch: aarch64
            target: dmg,app
            rust_target: ""
          - platform: macos-latest # Intel：在 arm runner 上交叉编译，避免排队 macos-13
            arch: x64
            target: dmg,app
            rust_target: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Add Rust cross target (macOS x64)
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      # —— macOS 才需要：Apple 开发者证书做 codesign（否则 Gatekeeper 拦截）——
      # 若你有 Developer ID 证书，把 base64 串配成 secret APPLE_CERTIFICATE、密码 APPLE_CERT_PASSWORD，
      # 并打开下面这段。暂无证书可先注释，用户首次打开时右键→"打开"绕过。
      #
      # - name: Import Apple certificate (macOS)
      #   if: matrix.platform == 'macos-latest'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      #   run: |
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #     echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
      #     security create-keychain -p ci "$KEYCHAIN_PATH"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      #     security unlock-keychain -p ci "$KEYCHAIN_PATH"
      #     security import $RUNNER_TEMP/cert.p12 -P "$APPLE_CERT_PASSWORD" -A -keychain "$KEYCHAIN_PATH"
      #     security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN_PATH"
      #     security default-keychain -s "$KEYCHAIN_PATH"

      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_TARGETS: ${{ matrix.target }}
          # 公证（可选，需 Apple 账号）：
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TickGold ${{ github.ref_name }}"
          releaseBody: |
            ## 更新内容
            - 通过顶栏"检查更新"即可自动升级。
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.target }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

  # 汇总 job：等两个平台都构建完成后，读取各自 .sig，生成 Tauri updater 需要的
  # latest.json 并上传到 Release。解决并行 matrix 下 tauri-action 漏传 latest.json 的问题。
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Generating latest.json for $TAG (version $VERSION)"

          REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets")

          # 用正式下载路径（草稿阶段的 browser_download_url 是 untagged 临时地址，发布后会 404）
          win_name=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("x64-setup.exe")) | .name')
          win_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$win_name"
          win_sig_id=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("x64-setup.exe.sig")) | .id')
          mac_arm_name=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("aarch64.app.tar.gz")) | .name')
          mac_arm_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$mac_arm_name"
          mac_arm_sig_id=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("aarch64.app.tar.gz.sig")) | .id')
          mac_x64_name=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("x64.app.tar.gz")) | .name')
          mac_x64_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$mac_x64_name"
          mac_x64_sig_id=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("x64.app.tar.gz.sig")) | .id')

          echo "win=$win_url"
          echo "mac_arm=$mac_arm_url"
          echo "mac_x64=$mac_x64_url"

          win_sig=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$win_sig_id" -H "Accept: application/octet-stream")
          mac_arm_sig=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$mac_arm_sig_id" -H "Accept: application/octet-stream")
          mac_x64_sig=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$mac_x64_sig_id" -H "Accept: application/octet-stream")

          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg v "$VERSION" \
            --arg d "$PUBDATE" \
            --arg wu "$win_url" --arg ws "$win_sig" \
            --arg mau "$mac_arm_url" --arg mas "$mac_arm_sig" \
            --arg mxu "$mac_x64_url" --arg mxs "$mac_x64_sig" \
            '{
              version: $v,
              notes: "",
              pub_date: $d,
              platforms: {
                "windows-x86_64": { nsis: { signature: $ws, url: $wu } },
                "darwin-aarch64": { app: { signature: $mas, url: $mau } },
                "darwin-x86_64": { app: { signature: $mxs, url: $mxu } }
              }
            }' > latest.json

          cat latest.json

          old_id=$(echo "$ASSETS" | jq -r '.[] | select(.name=="latest.json") | .id')
          if [ -n "$old_id" ] && [ "$old_id" != "null" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -X DELETE
          fi
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY"
          echo "latest.json uploaded."
