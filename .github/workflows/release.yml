name: release

# 推送 v* 标签触发。
# 设计：build 只负责「编译 + 签名 + 产出 bundle」并上传为 artifact，不直接操作 GitHub Release；
#       所有平台构建完成后，由唯一的 publish job 串行「创建唯一 Release → 上传全部资产 → 生成 latest.json」，
#       彻底避免并行 tauri-action 共享 Release 造成的多草稿 / Release 丢失问题。

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win
            platform: windows-latest
            rust_target: ""
            build_args: "--bundles nsis"
            artifact: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - label: mac-arm
            platform: macos-latest
            rust_target: ""
            build_args: "--bundles app,dmg"
            artifact: |
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/release/bundle/dmg/*.dmg
          - label: mac-x64
            platform: macos-latest
            rust_target: "x86_64-apple-darwin"
            build_args: "--bundles app,dmg --target x86_64-apple-darwin"
            artifact: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Add cross target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build & sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build ${{ matrix.build_args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release & upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "== collected files =="
          find dist -type f | sort

          # ---- 规整 macOS updater 包名（加架构后缀）----
          # 注意：.sig 内 file: 行仍记录原始名，Tauri updater 校验不依赖该文件名。
          if ls dist/mac-arm/*.app.tar.gz >/dev/null 2>&1; then
            mv dist/mac-arm/TickGold.app.tar.gz        "dist/mac-arm/TickGold_aarch64.app.tar.gz"
            mv dist/mac-arm/TickGold.app.tar.gz.sig    "dist/mac-arm/TickGold_aarch64.app.tar.gz.sig"
          fi
          if ls dist/mac-x64/*.app.tar.gz >/dev/null 2>&1; then
            mv dist/mac-x64/TickGold.app.tar.gz        "dist/mac-x64/TickGold_x64.app.tar.gz"
            mv dist/mac-x64/TickGold.app.tar.gz.sig    "dist/mac-x64/TickGold_x64.app.tar.gz.sig"
          fi

          WIN_EXE=$(find dist/win -name '*x64-setup.exe' | head -n1)
          WIN_SIG=$(find dist/win -name '*x64-setup.exe.sig' | head -n1)
          ARM_TGZ="dist/mac-arm/TickGold_aarch64.app.tar.gz"
          ARM_SIG="dist/mac-arm/TickGold_aarch64.app.tar.gz.sig"
          X64_TGZ="dist/mac-x64/TickGold_x64.app.tar.gz"
          X64_SIG="dist/mac-x64/TickGold_x64.app.tar.gz.sig"
          ARM_DMG=$(find dist/mac-arm -name '*.dmg' | head -n1)
          X64_DMG=$(find dist/mac-x64 -name '*.dmg' | head -n1)

          # ---- 创建唯一（草稿）Release 并上传全部资产 ----
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            RID="$EXISTING"
            echo "reuse release $RID"
          else
            RID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="TickGold $TAG" \
              -F draft=true -F prerelease=false --jq ".id")
            echo "created release $RID"
          fi

          # 清空可能残留的同名旧资产，保证幂等
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" \
              --jq ".[] | .id"); do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$AID" -X DELETE >/dev/null 2>&1 || true
          done

          gh release upload "$TAG" \
            "$WIN_EXE" "$WIN_SIG" \
            "$ARM_TGZ" "$ARM_SIG" "$X64_TGZ" "$X64_SIG" \
            "$ARM_DMG" "$X64_DMG" \
            --repo "$GITHUB_REPOSITORY" --clobber

          # ---- 生成扁平 latest.json ----
          win_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$WIN_EXE")"
          arm_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ARM_TGZ")"
          x64_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$X64_TGZ")"
          win_sig=$(cat "$WIN_SIG")
          arm_sig=$(cat "$ARM_SIG")
          x64_sig=$(cat "$X64_SIG")
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg v "$VERSION" --arg d "$PUBDATE" \
            --arg wu "$win_url" --arg ws "$win_sig" \
            --arg mau "$arm_url" --arg mas "$arm_sig" \
            --arg mxu "$x64_url" --arg mxs "$x64_sig" \
            '{
              version: $v,
              notes: "",
              pub_date: $d,
              platforms: {
                "windows-x86_64": { signature: $ws, url: $wu },
                "darwin-aarch64": { signature: $mas, url: $mau },
                "darwin-x86_64": { signature: $mxs, url: $mxu }
              }
            }' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::Release $TAG assets and latest.json uploaded (still draft)."
