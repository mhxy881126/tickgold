[package]
name = "tickgold"
version = "3.13.0"
description = "TickGold - 涓撲笟浜ゆ槗鑰呰法骞冲彴 A 鑲＄洴鐩樼粓绔?
authors = ["tickgold"]
edition = "2021"
default-run = "tickgold"

[lib]
name = "stock_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"
encoding_rs = "0.8"
tauri-plugin-opener = "2"
scraper = "0.27.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rfd = "0.17.2"
log = "0.4.22"
tauri-plugin-autostart = "2.5.1"

# ===== v1.9 AI 闂暟 / 鐭ヨ瘑搴?/ SSE 鎺ㄩ€?=====
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "2.3"
tokio-stream = "0.1"

# ===== v2.6 鎻掍欢鐢熸€侊細QuickJS 娌欑銆佺鍚嶆牎楠屻€丠TTP 鎷︽埅 =====
rquickjs = { version = "0.14.0", features = ["macro", "loader", "futures", "parallel"] }
url = "2.5.8"

# ===== v3.0.3 Pro 璁㈤槄鎺堟潈锛氱绾块潪瀵圭О绛惧悕鍗″瘑锛堥獙绛?绛惧彂锛?=====
rsa = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# macOS 绉佹湁 API锛氱伒鍔ㄥ矝闇€瑕侀€忔槑鑳屾櫙 + 鏃犳爣棰樻爮 API
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

