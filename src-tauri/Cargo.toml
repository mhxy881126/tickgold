[package]
name = "tickgold"
version = "2.7.0"
description = "TickGold - 涓撲笟浜ゆ槗鑰呰法骞冲彴 A 鑲＄洴鐩樼粓绔?
authors = ["tickgold"]
edition = "2021"

[lib]
name = "stock_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2"
scraper = "0.27.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rfd = "0.17.2"
log = "0.4.22"
tauri-plugin-autostart = "2.5.1"

# ===== v1.9 AI 鎱㈣剳锛氳竟杞﹀簱 / 绯荤粺鍑嵁绠?/ SSE 娴?=====
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "2.3"
tokio-stream = "0.1"

# ===== v2.6 鎻掍欢鐢熸€侊細QuickJS 杩愯鏃讹紱鍒稿晢/鎻掍欢璧勬簮 URL 瑙ｆ瀽 =====
rquickjs = { version = "0.14.0", features = ["macro", "loader", "futures", "parallel"] }
url = "2.5.8"

# macOS 閫忔槑绐楀彛锛堢伒鍔ㄥ矝姣涚幓鐠冿級闇€瑕佺鏈?API
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
