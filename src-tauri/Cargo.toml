[package]
name = "tickgold"
version = "2.24.0"
description = "TickGold - 涓撲笟浜ゆ槗鑰呰法骞冲彴 A 鑲＄洴鐩樼粓绔?
authors = ["tickgold"]
edition = "2021"

[lib]
name = "stock_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2"
scraper = "0.27.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rfd = "0.17.2"
log = "0.4.22"
tauri-plugin-autostart = "2.5.1"

# ===== v1.9 AI 闁逛究鍨奸崜鎶芥晬濮樺磭鐝堕弶鐑囩畱缁?/ 缂侇垵宕电划娲礄椤撶喎绁︾紒?/ SSE 婵?=====
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "2.3"
tokio-stream = "0.1"

# ===== v2.6 闁圭粯甯婂▎銏ゆ偨閻旂硶鍋撴笟濠勭獥QuickJS 閺夆晜鍔橀、鎴﹀籍鐠佸湱骞㈤柛鎺旑焾閺?闁圭粯甯婂▎銏㈡導閸曨剛鐖?URL 閻熸瑱绲鹃悗?=====
rquickjs = { version = "0.14.0", features = ["macro", "loader", "futures", "parallel"] }
url = "2.5.8"

# macOS 闂侇偄绻戝Σ鎴犵玻濡も偓瑜版盯鏁嶉崼顫触闁告柣鍔岄惌婵喰掑☉姘闁荤姴鍠涚槐姘舵閳ь剛鎲版担渚綄闁?API
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

