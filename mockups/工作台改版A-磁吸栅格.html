<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickGold · 工作台改版 A · 磁吸栅格 Bento</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b16'/%3E%3Cpath d='M7 21l5-5 4 3 9-9' stroke='%234fd8e8' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
:root{
  --bg:#070b16; --bg2:#0b1120; --panel:rgba(17,25,44,.78); --panel-solid:#10182c;
  --line:rgba(125,180,255,.14); --line-hi:rgba(79,216,232,.4);
  --cyan:#4fd8e8; --cyan-dim:rgba(79,216,232,.22);
  --red:#ff5b6a; --green:#22c55e; --amber:#f5a623; --purple:#a86bff;
  --text:#e8eef8; --text-dim:#8294b2; --text-faint:#4c5d7a;
  --cellH:56px; --gap:10px; --pad:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13px;user-select:none}
.num{font-family:Consolas,"SF Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
svg.icon{width:16px;height:16px;flex-shrink:0}

/* ============ 顶栏 ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:48px;z-index:120;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:linear-gradient(180deg,rgba(7,11,22,.96),rgba(7,11,22,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.4px;color:#fff}
.brand svg{width:20px;height:20px}
.brand b{color:var(--cyan);font-weight:700}
.scenes{display:flex;gap:3px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:3px}
.scene-btn{padding:4px 13px;border-radius:7px;border:none;background:transparent;color:var(--text-dim);font-size:12px;transition:all .18s}
.scene-btn:hover{color:var(--text)}
.scene-btn.active{color:var(--cyan);background:rgba(79,216,232,.12);box-shadow:inset 0 0 0 1px var(--cyan-dim)}
.search{flex:1;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;height:28px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
  padding:0 12px 0 30px;color:var(--text);font-size:12px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--cyan-dim)}
.search svg{position:absolute;left:10px;top:6px;opacity:.5}
.top-right{display:flex;align-items:center;gap:10px;margin-left:14px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clock{font-size:12px;letter-spacing:1px}
.btn-edit{display:flex;align-items:center;gap:6px;height:28px;padding:0 13px;border-radius:14px;font-size:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text-dim);transition:all .2s}
.btn-edit:hover{color:var(--cyan);border-color:var(--cyan-dim)}
body.editing .btn-edit{background:var(--cyan);border-color:var(--cyan);color:#04121a;font-weight:600}

/* ============ 左侧图标栏 ============ */
#leftnav{position:fixed;left:0;top:48px;bottom:0;width:52px;z-index:100;background:rgba(11,17,32,.85);
  border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;
  backdrop-filter:blur(10px)}
.nav-item{width:38px;height:38px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;cursor:pointer;color:var(--text-faint);position:relative;transition:all .18s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-item.active{color:var(--cyan)}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:2px;background:var(--cyan);border-radius:2px}
.nav-item .lbl{font-size:9px}
.nav-item svg{width:16px;height:16px}
.nav-sep{width:22px;height:1px;background:var(--line);margin:5px 0}

/* ============ 右侧导航 ============ */
#rightnav{position:fixed;right:0;top:48px;bottom:64px;width:216px;z-index:100;background:rgba(11,17,32,.85);
  border-left:1px solid var(--line);padding:12px;overflow-y:auto;backdrop-filter:blur(10px)}
.rn-head{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-bottom:10px;letter-spacing:.5px}
.rn-head svg{width:14px;height:14px}
.rn-search{margin-bottom:10px;position:relative}
.rn-search input{width:100%;height:26px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;
  padding:0 8px 0 26px;color:var(--text);font-size:11px;outline:none}
.rn-search input:focus{border-color:var(--cyan-dim)}
.rn-search svg{position:absolute;left:8px;top:5px;opacity:.45}
.rn-group{margin-bottom:8px}
.rn-group-head{font-size:10px;color:var(--text-faint);padding:4px 2px;letter-spacing:.5px;display:flex;justify-content:space-between}
.rn-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);padding:5px 8px;border-radius:6px;
  cursor:pointer;transition:all .15s;margin-bottom:1px}
.rn-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.rn-item.on{background:rgba(79,216,232,.1);color:var(--cyan)}
.rn-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.rn-item.hide{display:none}
.rn-title{margin:14px 0 8px;font-size:10px;color:var(--text-faint);letter-spacing:.5px;display:flex;justify-content:space-between}
.layout-item{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:8px;
  cursor:pointer;margin-bottom:6px;transition:all .18s;background:rgba(255,255,255,.02)}
.layout-item:hover{border-color:var(--cyan-dim)}
.layout-item.current{border-color:var(--cyan);background:rgba(79,216,232,.07)}
.layout-thumb{width:52px;height:30px;border-radius:3px;background:rgba(255,255,255,.05);position:relative;flex-shrink:0;overflow:hidden}
.layout-thumb i{position:absolute;display:block;border-radius:1px}
.layout-meta{flex:1}
.layout-meta .nm{font-size:12px}
.layout-meta .sub{font-size:10px;color:var(--text-faint)}
.save-layout{width:100%;margin-top:6px;padding:7px;border-radius:8px;border:1px dashed var(--cyan-dim);background:transparent;
  color:var(--cyan);font-size:12px;transition:all .2s}
.save-layout:hover{background:rgba(79,216,232,.1)}

/* ============ 舞台与栅格 ============ */
#stage{position:fixed;left:52px;right:216px;top:48px;bottom:64px;overflow:auto;scrollbar-width:thin}
#board{position:relative;min-height:100%;padding:var(--pad);width:100%}
#gridOverlay{position:absolute;inset:0;pointer-events:none;display:none;opacity:.6;
  background-image:linear-gradient(rgba(79,216,232,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(79,216,232,.09) 1px,transparent 1px)}
body.editing #gridOverlay{display:block}
#ghost{position:absolute;border:1.5px dashed var(--cyan);border-radius:10px;background:rgba(79,216,232,.08);
  box-shadow:0 0 0 4px rgba(79,216,232,.06) inset;pointer-events:none;display:none;z-index:5}
/* 聚焦虚化层 */
#dimLayer{position:fixed;inset:0;background:rgba(4,7,14,.55);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
body.spotlight #dimLayer{opacity:1;pointer-events:auto}

/* ============ 卡片 ============ */
.card{position:absolute;background:linear-gradient(160deg,rgba(20,30,52,.92),rgba(14,21,38,.9));
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:default;
  box-shadow:0 6px 24px rgba(0,0,0,.38);transition:left .42s cubic-bezier(.22,.9,.24,1),top .42s cubic-bezier(.22,.9,.24,1),
  width .42s cubic-bezier(.22,.9,.24,1),height .42s cubic-bezier(.22,.9,.24,1),opacity .25s,filter .25s,box-shadow .2s;
  display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:var(--line-hi)}
body.editing .card{cursor:grab}
body.editing .card:active{cursor:grabbing}
.card.dragging{z-index:60;box-shadow:0 18px 50px rgba(79,216,232,.22);border-color:var(--cyan);transform:scale(1.02)}
.card.spot{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 18px 60px rgba(79,216,232,.35);z-index:90}
body.spotlight .card:not(.spot){opacity:.28;filter:blur(1.2px)}
body.spotlight .card.spot{transform:scale(1.03)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;flex-shrink:0}
.card-head .ttl{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.card-head .ttl svg{width:13px;height:13px;opacity:.75}
.card-head .ops{display:none;gap:4px}
body.editing .card-head .ops{display:flex}
.op-btn{width:19px;height:19px;border-radius:5px;border:none;background:rgba(255,255,255,.07);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.op-btn:hover{background:var(--cyan);color:#03121a}
.card-body{flex:1;min-height:0;display:flex;flex-direction:column}
.resize-h{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;display:none;
  background:linear-gradient(135deg,transparent 45%,var(--text-faint) 46%,var(--text-faint) 55%,transparent 56%)}
body.editing .resize-h{display:block}
.resize-h:hover{background:linear-gradient(135deg,transparent 45%,var(--cyan) 46%,var(--cyan) 55%,transparent 56%)}

/* 卡片内通用 */
.big{font-size:25px;font-weight:700;line-height:1.05}
.kv{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 0;color:var(--text-dim)}
.kv b{color:var(--text);font-weight:500}
.up{color:var(--red)} .down{color:var(--green)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px}
.tag.up{background:rgba(255,91,106,.15);color:var(--red)}
.tag.down{background:rgba(34,197,94,.15);color:var(--green)}
.spark{width:100%;height:100%;min-height:22px}
.gauge-num{font-size:22px;font-weight:700}
.mini-sub{font-size:10px;color:var(--text-faint);margin-top:auto}

/* 情绪温度弧 */
.arc{width:46px;height:46px;flex-shrink:0}

/* 五档 */
.five{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:10.5px;color:var(--text-dim);margin-top:4px}
.five .l{display:flex;justify-content:space-between;padding:2px 6px;border-radius:4px}
.five .l.s{background:rgba(255,91,106,.09)} .five .l.b{background:rgba(34,197,94,.09)}

/* 热力格 */
.heat{display:grid;gap:2px;flex:1;min-height:0}
.heat i{border-radius:2px}

/* 连板梯队 */
.ladder{display:flex;gap:5px;margin-top:5px}
.ladder .ld{flex:1;text-align:center;border-radius:6px;padding:3px 0;font-size:10px;background:rgba(255,91,106,.12);color:var(--red)}
.ladder .ld b{display:block;font-size:14px}

/* 时间线 */
.tl{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--text-dim)}
.tl .t{display:flex;gap:8px;align-items:baseline}
.tl .t .tm{color:var(--cyan);font-family:Consolas,monospace;font-size:10px;width:38px;flex-shrink:0}

/* 排行列表 */
.rank-list{display:flex;flex-direction:column;gap:2px;font-size:11px;margin-top:4px}
.rank-row{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;border-radius:4px}
.rank-row:nth-child(odd){background:rgba(255,255,255,.03)}

/* AI 问数 */
.ai-q{font-size:11.5px;color:var(--text-dim);font-style:italic}
.ai-answer{font-size:11px;color:var(--text);line-height:1.55;margin-top:5px}
.ai-btn{align-self:flex-start;margin-top:auto;padding:3px 10px;border-radius:12px;border:1px solid var(--cyan-dim);
  background:rgba(79,216,232,.1);color:var(--cyan);font-size:11px;transition:all .2s}
.ai-btn:hover{background:var(--cyan);color:#03121a}

/* ============ 编排工具条与卡片库 ============ */
#editBar{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:200;display:none;align-items:center;gap:8px;
  background:var(--panel-solid);border:1px solid var(--cyan-dim);border-radius:22px;padding:5px 12px;font-size:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.55);backdrop-filter:blur(14px)}
body.editing #editBar{display:flex}
#editBar .sep{width:1px;height:18px;background:var(--line)}
#editBar button{display:flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--text-dim);
  padding:4px 9px;border-radius:14px;font-size:12px;transition:all .18s}
#editBar button:hover{color:var(--cyan);background:rgba(79,216,232,.1)}
#editBar button.primary{background:var(--cyan);color:#03121a;font-weight:600}
#editBar button.primary:hover{filter:brightness(1.1)}
#editBar .hint{font-size:11px;color:var(--text-faint);padding-right:4px}
#library{position:fixed;left:52px;top:48px;bottom:64px;width:200px;z-index:150;transform:translateX(-100%);
  background:rgba(11,17,32,.96);border-right:1px solid var(--cyan-dim);padding:14px 12px;transition:transform .3s cubic-bezier(.22,.9,.24,1);
  overflow-y:auto;backdrop-filter:blur(14px)}
body.editing #library{transform:translateX(0)}
#library h4{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-bottom:10px;letter-spacing:.5px}
.lib-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:all .18s;background:rgba(255,255,255,.02)}
.lib-item:hover{border-color:var(--cyan);color:var(--text)}
.lib-item svg{width:13px;height:13px;opacity:.7}
.lib-item .add{margin-left:auto;color:var(--cyan);font-size:15px;line-height:1}

/* ============ 底部卡片坞 ============ */
#dock{position:fixed;left:52px;right:216px;bottom:0;height:64px;z-index:110;background:rgba(11,17,32,.9);
  border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;backdrop-filter:blur(12px)}
.dock-label{font-size:10px;color:var(--text-faint);letter-spacing:.5px;writing-mode:vertical-lr;height:34px;display:flex;align-items:center;gap:2px}
.dock-items{flex:1;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.dock-items::-webkit-scrollbar{display:none}
.dock-chip{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);color:var(--text-dim);font-size:11.5px;cursor:pointer;white-space:nowrap;transition:all .18s;flex-shrink:0}
.dock-chip:hover{color:var(--text);border-color:var(--cyan-dim);transform:translateY(-1px)}
.dock-chip.on{background:rgba(79,216,232,.12);border-color:var(--cyan);color:var(--cyan)}
.dock-chip .k{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.07);display:flex;align-items:center;
  justify-content:center;font-size:9px;color:var(--text-faint)}
.dock-chip.on .k{background:rgba(79,216,232,.2);color:var(--cyan)}
.dock-chip .pv{width:5px;height:5px;border-radius:50%}
.dock-chip .pv.up{background:var(--red)} .dock-chip .pv.down{background:var(--green)} .dock-chip .pv.flat{background:var(--text-faint)}

/* ============ Toast / 提示 ============ */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:400;background:var(--panel-solid);
  border:1px solid var(--cyan-dim);padding:8px 18px;border-radius:20px;font-size:12px;color:var(--cyan);
  display:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.show{display:block;animation:up .3s ease}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:300;background:rgba(79,216,232,.1);
  border:1px solid var(--cyan-dim);color:var(--cyan);font-size:11.5px;padding:6px 14px;border-radius:16px;display:none}

/* ============ 响应式 ============ */
@media(max-width:1100px){
  #rightnav{display:none}
  #stage,#dock{right:0}
}
@media(max-width:720px){
  #leftnav{display:none}
  #stage{left:0;bottom:56px}
  #dock{left:0;right:0;height:56px}
  :root{--cellH:52px;--gap:8px;--pad:10px}
  #topbar .scenes{overflow-x:auto;max-width:42vw}
  .btn-edit span{display:none}
  #editBar{flex-wrap:wrap;max-width:92vw}
  #library{left:0}
  .card{border-radius:9px}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4fd8e8" stroke-width="2.2" stroke-linecap="round"><path d="M4 17l5-5 3.5 3L20 7"/><path d="M15 7h5v5"/></svg>
    Tick<b>Gold</b>
  </div>
  <div class="scenes" id="scenes"></div>
  <div class="search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="globalSearch" placeholder="搜索代码 / 名称 / 卡片">
  </div>
  <div class="top-right">
    <div class="live"><span class="live-dot"></span>实时</div>
    <div class="clock num" id="clock">--:--:--</div>
    <button class="btn-edit" id="btnEdit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>编排</span></button>
  </div>
</div>

<!-- ===== 左侧导航 ===== -->
<div id="leftnav" class="leftnav"></div>

<!-- ===== 右侧导航 ===== -->
<div id="rightnav">
  <div class="rn-head"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>卡片导航</div>
  <div class="rn-search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="rnFilter" placeholder="过滤卡片…">
  </div>
  <div id="rnGroups"></div>
  <div class="rn-title"><span>布局方案</span><span>4 套</span></div>
  <div id="layoutList"></div>
  <button class="save-layout" id="btnSaveLayout">+ 保存当前编排为新布局</button>
</div>

<!-- ===== 舞台 ===== -->
<div id="stage">
  <div id="board">
    <div id="gridOverlay"></div>
    <div id="ghost"></div>
  </div>
</div>
<div id="dimLayer"></div>

<!-- ===== 编排工具条 ===== -->
<div id="editBar">
  <span class="hint">拖拽磁吸 · 角部拉伸改尺寸</span>
  <button id="btnAuto">自动整理</button>
  <span class="sep"></span>
  <button id="btnSave2">保存布局</button>
  <button class="primary" id="btnDone">完成编排</button>
</div>

<!-- ===== 卡片库抽屉 ===== -->
<div id="library">
  <h4><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 012-2h12a2 2 0 012 2v14"/><path d="M4 19a2 2 0 002 2h12"/></svg>卡片库 · 拖入即可添加</h4>
  <div id="libItems"></div>
</div>

<!-- ===== 底部卡片坞 ===== -->
<div id="dock">
  <div class="dock-label">卡片坞 · 点击切换</div>
  <div class="dock-items" id="dockItems"></div>
</div>

<div id="toast"></div>
<div id="hint">双击卡片标题或点「编排」进入自由编排</div>

<script>
/* ============================================================
   TickGold 磁吸栅格 Bento · 工作台原型
   卡片 = 栅格单元(col,row,w,h) ；流体磁贴 = 拖拽吸附 + 周围卡片让位
   ============================================================ */

   pos:{idx:{c:0,r:0},emo:{c:4,r:0},lu:{c:7,r:0},lhb:{c:10,r:0},stock:{c:0,r:2}}},
  {key:'review',name:'盘后复盘',cards:['idx','tl','lhb','heat','ai','fav'],
   pos:{idx:{c:0,r:0},tl:{c:4,r:0},lhb:{c:9,r:0},heat:{c:0,r:2},fav:{c:6,r:2},ai:{c:9,r:2}}},

   pos:{idx:{c:0,r:0},lu:{c:4,r:0},stock:{c:0,r:2}}},

/* ---------- 状态 ---------- */
const cards={};   // id -> {id,t,w,h,col,row,visible,el}
let order=[];     // 可见卡片 z 序
let scene='intraday';
let drag=null,resize=null,spot=null;

/* ---------- 几何 ---------- */
const MOBILE=()=>window.innerWidth<760;
function cols(){return MOBILE()?2:GRID.cols;}
function cw(id){return MOBILE()?2:cards[id].w;}
function ch(id){return MOBILE()?cards[id].h+1:cards[id].h;}
function colW(){const b=$('board');const c=cols();return (b.clientWidth-GRID.pad*2-GRID.gap*(c-1))/c;}
function xOf(c){return GRID.pad+c*(colW()+GRID.gap);}
function yOf(r){return GRID.pad+r*(GRID.cellH+GRID.gap);}
function boardH(){let m=0;order.forEach(id=>{const c=cards[id];if(c.visible)m=Math.max(m,c.row+ch(id));});
  return GRID.pad*2+m*(GRID.cellH+GRID.gap)-GRID.gap;}

/* ---------- 布局引擎：占用格 + 首个空位 ---------- */
function firstFree(c,occ){
  const w=cw(c.id),h=ch(c.id);
  for(let r=0;r<64;r++)for(let col=0;col<=cols()-w;col++){
    let ok=true;
    for(let dr=0;dr<h&&ok;dr++)for(let dc=0;dc<w;dc++){if(occ.has((r+dr)+','+(col+dc))){ok=false;break;}}
    if(ok)return{col,row:r};
  }
  return{col:0,row:0};
}
function reflow(ids,fixed={}){
  const occ=new Set();const res={};
  ids.forEach(id=>{
    const c=cards[id];
    const w=cw(id),h=ch(id);
    let pos;
    if(fixed[id])pos={col:Math.min(fixed[id].col,cols()-w),row:Math.max(0,fixed[id].row)};
    else pos=firstFree(c,occ);
    c.col=pos.col;c.row=pos.row;
    for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++)occ.add((c.row+dr)+','+(c.col+dc));
    res[id]=pos;
  });
  return res;
}

/* ---------- 渲染 ---------- */
function renderBoard(){
  const b=$('board');
  order.forEach(id=>{
    const c=cards[id];if(!c.visible)return;
    let el=c.el;
    if(!el){el=document.createElement('div');el.className='card';el.dataset.id=id;
      el.innerHTML=`<div class="card-head"><span class="ttl"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>${c.t}</span>
        <div class="ops"><button class="op-btn" data-op="remove" title="移除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px;height:10px"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></div>
        <div class="card-body">${DEFS[id].body}</div>
        <div class="resize-h" title="拖拽调整尺寸"></div>`;
      c.el=el;
      el.querySelector('.ai-btn')&&el.querySelector('.ai-btn').addEventListener('click',()=>toast('AI 助手演示：已生成今日情绪研判'));
      el.querySelector('[data-op="remove"]')&&el.querySelector('[data-op="remove"]').addEventListener('click',e=>{e.stopPropagation();removeCard(id);});
      attachCard(el,id);
      b.appendChild(el);
    }
    el.style.display='';
    el.style.width=cw(id)*colW()+(cw(id)-1)*GRID.gap+'px';
    el.style.height=ch(id)*GRID.cellH+(ch(id)-1)*GRID.gap+'px';
    el.style.left=xOf(c.col)+'px';
    el.style.top=yOf(c.row)+'px';
    if(!el._heat){const g=el.querySelector('#heatGrid');if(g){el._heat=1;
      const colors=['#ff5b6a','#f5a623','#22c55e','#4fd8e8','#a86bff'];
      g.innerHTML='';for(let i=0;i<36;i++){const d=document.createElement('i');
        d.style.background=colors[Math.floor(Math.random()*5)];
        d.style.opacity=(0.25+Math.random()*0.7).toFixed(2);g.appendChild(d);}}}
  });
  // 隐藏未用
  Object.values(cards).forEach(c=>{if(!c.visible&&c.el)c.el.style.display='none';});
  b.style.height=boardH()+'px';
  renderDock();renderNav();renderLayouts();
}
function hideGhost(){const g=$('ghost');g.style.display='none';}

/* ---------- 拖拽磁贴 ---------- */
function cellFromEvent(e){
  const b=$('board'),r=b.getBoundingClientRect();
  const relX=e.clientX-r.left-GRID.pad,relY=e.clientY-r.top-GRID.pad;
  const col=Math.round(relX/(colW()+GRID.gap));
  const row=Math.round(relY/(GRID.cellH+GRID.gap));
  return{col:Math.max(0,Math.min(col,cols()-1)),row:Math.max(0,row)};
}
function attachCard(el,id){
  el.addEventListener('mousedown',e=>{
    if(!document.body.classList.contains('editing'))return;
    if(e.target.closest('.op-btn')||e.target.closest('.resize-h'))return;
    const c=cards[id];
    drag={id,ox:e.clientX,oy:e.clientY,cell:{col:c.col,row:c.row}};
    el.classList.add('dragging');
    const g=$('ghost');
    g.style.display='block';
    g.style.width=cw(id)*colW()+(cw(id)-1)*GRID.gap+'px';
    g.style.height=ch(id)*GRID.cellH+(ch(id)-1)*GRID.gap+'px';
    g.style.left=xOf(c.col)+'px';g.style.top=yOf(c.row)+'px';
    e.preventDefault();
  });
  const rh=el.querySelector('.resize-h');
  rh.addEventListener('mousedown',e=>{
    if(!document.body.classList.contains('editing'))return;
    e.stopPropagation();
    const c=cards[id];
    resize={id,sx:e.clientX,sy:e.clientY,ow:c.w,oh:c.h};
    el.classList.add('dragging');
    e.preventDefault();
  });
}
window.addEventListener('mousemove',e=>{
  if(drag){
    const c=cards[drag.id];
    const cell=cellFromEvent(e);
    const col=Math.max(0,Math.min(cell.col,cols()-cw(drag.id)));
    const row=Math.max(0,cell.row);
    if(col===drag.cell.col&&row===drag.cell.row)return;
    drag.cell={col,row};
    // 重新编排：拖拽卡插入指针槽位，其余卡顺序不变，磁吸让位
    const others=order.filter(x=>x!==drag.id).slice();
    others.sort((a,b)=>(cards[a].row-cards[b].row)||(cards[a].col-cards[b].col));
    let idx=others.findIndex(x=>cards[x].row>row||(cards[x].row===row&&cards[x].col>col));
    if(idx<0)idx=others.length;
    const newOrder=others.slice(0,idx).concat([drag.id]).concat(others.slice(idx));
    order=newOrder;
    const fixed={};fixed[drag.id]={col,row};
    reflow(order,fixed);
    renderBoard();
    const g=$('ghost');
    g.style.left=xOf(col)+'px';g.style.top=yOf(row)+'px';
  }
  if(resize){
    const c=cards[resize.id];
    const cw2=colW()+GRID.gap,ch2=GRID.cellH+GRID.gap;
    const dw=Math.round((e.clientX-resize.sx)/cw2),dh=Math.round((e.clientY-resize.sy)/ch2);
    const maxW=MOBILE()?2:GRID.cols-c.col;
    let w=Math.max(1,Math.min(resize.ow+dw,maxW));
    let h=Math.max(1,Math.min(resize.oh+dh,12));
    if(w===c.w&&h===c.h)return;
    c.w=w;c.h=h;
    c.col=Math.min(c.col,GRID.cols-w);
    const fixed={};fixed[resize.id]={col:c.col,row:c.row};
    reflow(order,fixed);
    renderBoard();
  }
});
window.addEventListener('mouseup',()=>{
  if(drag){drag.el&&drag.el.classList.remove('dragging');hideGhost();drag=null;}
  if(resize){const el=cards[resize.id]&&cards[resize.id].el;el&&el.classList.remove('dragging');resize=null;toast('尺寸已调整 · 松手自动对齐栅格');}
});

/* ---------- 卡片操作 ---------- */
function addCard(id){
  if(cards[id]&&cards[id].visible){toast('卡片已在工作台');return;}
  if(!cards[id]){cards[id]={id,t:DEFS[id].t,w:DEFS[id].w,h:DEFS[id].h,col:0,row:0,visible:true};}
  cards[id].visible=true;
  order.push(id);
  const fixed={};fixed[id]={col:cards[id].col,row:cards[id].row};
  reflow(order,fixed);
  renderBoard();
  toast(`已添加「${DEFS[id].t}」`);
}
function removeCard(id){
  cards[id].visible=false;
  order=order.filter(x=>x!==id);
  reflow(order);
  renderBoard();
  toast(`已移除「${DEFS[id].t}」`);
  if(spot===id)exitSpotlight();
}

/* ---------- 切换与聚焦 ---------- */
function switchScene(key){
  scene=key;
  document.querySelectorAll('.scene-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  const s=SCENES.find(x=>x.key===key);
  order=[];
  Object.values(cards).forEach(c=>c.visible=false);
  s.cards.forEach(id=>{
    if(!cards[id])cards[id]={id,t:DEFS[id].t,w:DEFS[id].w,h:DEFS[id].h,col:0,row:0,visible:true};
    cards[id].visible=true;
    order.push(id);
  });
  // 应用预设位置再让位校正（移动端全宽堆叠，跳过预设）
  const fixed={};
  if(!MOBILE())Object.entries(s.pos).forEach(([id,p])=>{if(cards[id])fixed[id]={col:p.c,row:p.r};});
  reflow(order,fixed);
  renderBoard();
  exitSpotlight();
  toast(`已切换场景 · ${s.name}（${s.cards.length} 张卡片）`);
}
function jumpTo(id){
  if(!cards[id]||!cards[id].visible){toast('该卡片在当前场景未启用');return;}
  if(document.body.classList.contains('editing'))return;
  exitSpotlight();
  const el=cards[id].el;
  const stage=$('stage');
  const top=yOf(cards[id].row)+ch(id)*GRID.cellH/2-stage.clientHeight/2;
  stage.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  setTimeout(()=>{
    exitSpotlight();
    document.querySelectorAll('.card').forEach(x=>x.classList.remove('spot'));
    el.classList.add('spot');
    document.body.classList.add('spotlight');
    spot=id;
    document.querySelectorAll('.rn-item,.dock-chip').forEach(x=>x.classList.toggle('on',x.dataset.card===id));
  },420);
}
function exitSpotlight(){
  document.body.classList.remove('spotlight');
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('spot'));
  document.querySelectorAll('.rn-item,.dock-chip').forEach(x=>x.classList.remove('on'));
  spot=null;
}
$('dimLayer').addEventListener('click',exitSpotlight);
window.addEventListener('keydown',e=>{
  if(e.key==='Escape')exitSpotlight();
  const n=parseInt(e.key);
  if(n>=1&&n<=9){const list=order.filter(id=>cards[id].visible);if(list[n-1])jumpTo(list[n-1]);}
});

/* ---------- 编排模式 ---------- */
function setEditing(on){
  document.body.classList.toggle('editing',on);
  $('btnEdit').querySelector('span').textContent=on?'完成':'编排';
  if(!on){hideGhost();if(drag){drag=null;}if(resize)resize=null;}
  $('hint').style.display=on?'none':'block';
}
$('btnEdit').addEventListener('click',()=>setEditing(!document.body.classList.contains('editing')));
$('btnDone').addEventListener('click',()=>{setEditing(false);toast('编排已保存到当前场景');});
$('btnSave2').addEventListener('click',()=>toast('布局已保存 · 可随时从右侧「布局方案」恢复'));
$('btnSaveLayout').addEventListener('click',()=>toast('已保存为「我的布局」'));
$('btnAuto').addEventListener('click',()=>{
  const s=SCENES.find(x=>x.key===scene);
  const fixed={};if(!MOBILE())Object.entries(s.pos).forEach(([id,p])=>{if(cards[id]&&cards[id].visible)fixed[id]={col:p.c,row:p.r};});
  reflow(order,fixed);renderBoard();toast('已自动整理到预设栅格');
});
document.addEventListener('dblclick',e=>{
  if(e.target.closest('.card-head')){setEditing(!document.body.classList.contains('editing'));}
});

/* ---------- 右侧导航 ---------- */
function renderNav(){
  const box=$('rnGroups');box.innerHTML='';
  const groups={};
  order.filter(id=>cards[id].visible).forEach(id=>{
    const g=DEFS[id].grp;(groups[g]=groups[g]||[]).push(id);
  });
  Object.entries(groups).forEach(([g,ids])=>{
    const d=document.createElement('div');d.className='rn-group';
    d.innerHTML=`<div class="rn-group-head"><span>${g}</span><span style="font-size:10px;color:var(--text-faint)">${ids.length}</span></div>`;
    ids.forEach(id=>{
      const it=document.createElement('div');it.className='rn-item';it.dataset.card=id;
      it.innerHTML=`<span class="dot" style="background:${DEFS[id].c}"></span>${DEFS[id].t}`;
      it.addEventListener('click',()=>jumpTo(id));
      d.appendChild(it);
    });
    box.appendChild(d);
  });
}
$('rnFilter').addEventListener('input',e=>{
  const k=e.target.value.trim();
  document.querySelectorAll('.rn-item').forEach(it=>{
    const name=DEFS[it.dataset.card].t;
    it.classList.toggle('hide',!!k&&!name.includes(k));
  });
});
function renderLayouts(){
  const box=$('layoutList');box.innerHTML='';
  SCENES.forEach((s,i)=>{
    const d=document.createElement('div');d.className='layout-item'+(s.key===scene?' current':'');
    d.innerHTML=`<div class="layout-thumb"></div>
      <div class="layout-meta"><div class="nm">${s.name}</div><div class="sub">${s.cards.length} 张卡片</div></div>`;
    // 缩略图色块
    const th=d.querySelector('.layout-thumb');
    s.cards.forEach((id,ci)=>{
      const p=s.pos[id]||{c:ci%4,r:Math.floor(ci/4)};
      const c=DEFS[id];
      const i2=document.createElement('i');
      i2.style.left=(p.c*13+3)+'px';i2.style.top=(p.r*10+3)+'px';
      i2.style.width=Math.max(10,c.w*7)+'px';i2.style.height=Math.max(7,c.h*4)+'px';
      i2.style.background=c.c;i2.style.opacity=.75;th.appendChild(i2);
    });
    d.addEventListener('click',()=>{switchScene(s.key);renderLayouts();});
    box.appendChild(d);
  });
}
function renderDock(){
  const box=$('dockItems');box.innerHTML='';
  order.filter(id=>cards[id].visible).forEach((id,i)=>{
    const c=cards[id],def=DEFS[id];
    const d=document.createElement('div');d.className='dock-chip';d.dataset.card=id;
    const pv=def.c==='#ff5b6a'?'up':(def.c==='#22c55e'?'down':'flat');
    d.innerHTML=`<span class="k">${i+1}</span><span class="pv ${pv}"></span>${def.t}`;
    d.addEventListener('click',()=>jumpTo(id));
    box.appendChild(d);
  });
}

/* ---------- 左侧导航 ---------- */
(function(){
  const items=[['market','大盘','#4fd8e8'],['watch','盯盘','#22c55e'],['emo','情绪','#f5a623'],
    ['sector','板块','#a86bff'],['stock','个股','#ff5b6a'],['trade','交易','#4fd8e8']];
  const box=$('leftnav');
  items.forEach(([k,lbl,c],i)=>{
    const d=document.createElement('div');d.className='nav-item'+(i===0?' active':'');
    d.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="${['M3 17l6-6 4 4 8-8M14 7h7v7','M12 7v5l3 2','M12 2a7 7 0 017 7c0 3-2 5-3 7h-8c-1-2-3-4-3-7a7 7 0 017-7z','M3 3v18h18M3 9h18M3 15h18','M4 20V10M10 20V4M16 20v-8M22 20H2','M3 3v18h18M7 14l4-4 4 4 5-5'][i]}"/></svg>
      <span class="lbl">${lbl}</span>`;
    d.addEventListener('click',()=>{
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      if(k==='watch')toast('盯盘模式 · 卡片已聚焦大盘与个股');
    });
    box.appendChild(d);
  });
  const sep=document.createElement('div');sep.className='nav-sep';box.appendChild(sep);
  const ai=document.createElement('div');ai.className='nav-item';
  ai.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lbl">AI</span>`;
  ai.addEventListener('click',()=>toast('AI 助手演示 · 已生成盘中研判'));
  box.appendChild(ai);
})();

/* ---------- 卡片库 ---------- */
(function(){
  const lib=['sp','tc','bo','tick'];
  const box=$('libItems');
  lib.forEach(id=>{
    const d=document.createElement('div');d.className='lib-item';
    d.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>${DEFS[id].t}<span class="add">+</span>`;
    d.addEventListener('click',()=>addCard(id));
    box.appendChild(d);
  });
})();

/* ---------- 场景按钮 ---------- */
(function(){
  const box=$('scenes');
  SCENES.forEach(s=>{
    const b=document.createElement('button');b.className='scene-btn'+(s.key===scene?' active':'');
    b.dataset.key=s.key;b.textContent=s.name;
    b.addEventListener('click',()=>switchScene(s.key));
    box.appendChild(b);
  });
})();

/* ---------- 全局搜索 ---------- */
$('globalSearch').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const k=e.target.value.trim();if(!k)return;
  const hit=order.find(id=>DEFS[id].t.includes(k)||DEFS[id].t.includes(k.toUpperCase()));
  if(hit)jumpTo(hit);else toast('未找到匹配卡片');
});

/* ---------- 时钟 ---------- */
setInterval(()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
},1000);
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1900);
}
window.addEventListener('resize',()=>{reflow(order);renderBoard();});

/* ---------- 启动 ---------- */
switchScene('intraday');
renderBoard();
setTimeout(()=>{toast('双击卡片标题或点右上角「编排」体验磁吸栅格');},1200);
setTimeout(()=>{$('hint').style.display='none';},6000);
</script>
</body>
</html>
