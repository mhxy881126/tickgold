<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickGold · 工作台改版 B · 灵动岛命令中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23070b16'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234fd8e8'/%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
:root{
  --bg:#05080f; --bg2:#0a1120; --panel:rgba(14,22,40,.55); --panel-solid:#0d1526;
  --line:rgba(130,180,255,.13); --line-hi:rgba(79,216,232,.5);
  --cyan:#4fd8e8; --cyan-dim:rgba(79,216,232,.25);
  --red:#ff5b6a; --green:#22c55e; --amber:#f5a623; --purple:#a86bff;
  --text:#e9eff9; --text-dim:#8597b5; --text-faint:#4d5f7c;
  --cellH:60px; --gap:12px; --pad:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:
  radial-gradient(1100px 600px at 20% -10%,rgba(79,216,232,.09),transparent 55%),
  radial-gradient(900px 700px at 90% 110%,rgba(168,107,255,.08),transparent 55%),var(--bg);
  color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13px;user-select:none}
.num{font-family:Consolas,"SF Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
svg.icon{width:16px;height:16px;flex-shrink:0}

/* ============ 顶栏：品牌 + 灵动岛胶囊 ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:120;display:flex;align-items:center;gap:16px;
  padding:0 16px;background:linear-gradient(180deg,rgba(5,8,15,.92),rgba(5,8,15,.6));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#fff;letter-spacing:.4px}
.brand svg{width:20px;height:20px}
.brand b{color:var(--cyan)}
/* 灵动岛胶囊 */
.island{position:relative;margin:0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 16px;
  border-radius:20px;background:rgba(10,16,30,.85);border:1px solid var(--cyan-dim);
  box-shadow:0 0 0 4px rgba(79,216,232,.05),0 6px 24px rgba(0,0,0,.4);cursor:pointer;transition:all .22s;z-index:130}
.island:hover{border-color:var(--cyan);box-shadow:0 0 20px rgba(79,216,232,.25)}
.island .cur{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text)}
.island .cur .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.island .caret{color:var(--text-faint);font-size:9px;transition:transform .2s}
.island.open .caret{transform:rotate(180deg)}
.island .quick{display:flex;gap:3px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line)}
.island .quick button{border:none;background:transparent;color:var(--text-dim);padding:3px 7px;border-radius:10px;font-size:11px;transition:all .18s}
.island .quick button:hover{color:var(--cyan);background:rgba(79,216,232,.12)}
.island-menu{position:absolute;top:42px;left:50%;transform:translateX(-50%);width:300px;background:rgba(11,18,32,.97);
  border:1px solid var(--line);border-radius:16px;padding:8px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6);
  backdrop-filter:blur(20px)}
.island.open .island-menu{display:block;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateX(-50%) scale(.94);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.island-menu .im-t{font-size:10px;color:var(--text-faint);padding:6px 8px 4px;letter-spacing:.5px}
.im-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--text-dim);transition:all .15s}
.im-item:hover,.im-item.active{background:rgba(79,216,232,.1);color:var(--cyan)}
.im-item svg{width:14px;height:14px}
.im-item .cnt{margin-left:auto;font-size:10px;color:var(--text-faint)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clock{font-size:12px;letter-spacing:1px}
.kbd-hint{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-faint)}
.kbd-hint kbd{background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:Consolas,monospace}

/* ============ 左侧极简图标栏 ============ */
#rail{position:fixed;left:0;top:52px;bottom:0;width:50px;z-index:100;background:rgba(8,13,24,.8);
  border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;backdrop-filter:blur(10px)}
.rail-item{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--text-faint);position:relative;transition:all .18s}
.rail-item:hover{color:var(--text);background:rgba(255,255,255,.06)}
.rail-item.active{color:var(--cyan);background:rgba(79,216,232,.1)}
.rail-item .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:var(--panel-solid);
  border:1px solid var(--line);padding:3px 9px;border-radius:7px;font-size:11px;color:var(--text);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:200}
.rail-item:hover .tip{opacity:1}
.rail-sep{width:20px;height:1px;background:var(--line);margin:6px 0}

/* ============ 舞台 ============ */
#stage{position:fixed;left:50px;right:0;top:52px;bottom:0;overflow:auto;scrollbar-width:thin}
#board{position:relative;min-height:100%;padding:var(--pad)}
#gridOverlay{position:absolute;inset:0;pointer-events:none;display:none;opacity:.55;
  background-image:linear-gradient(rgba(79,216,232,.08) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(79,216,232,.08) 1px,transparent 1px)}
body.editing #gridOverlay{display:block}
#ghost{position:absolute;border:1.5px dashed var(--cyan);border-radius:14px;background:rgba(79,216,232,.09);
  pointer-events:none;display:none;z-index:5}
#dimLayer{position:fixed;inset:0;background:rgba(3,5,10,.5);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
body.focusing #dimLayer{opacity:1;pointer-events:auto}

/* ============ 玻璃浮岛卡片 ============ */
.card{position:absolute;background:linear-gradient(155deg,rgba(22,32,56,.82),rgba(12,19,36,.72));
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:default;
  box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.02) inset;
  backdrop-filter:blur(16px);
  transition:left .45s cubic-bezier(.22,.9,.24,1),top .45s cubic-bezier(.22,.9,.24,1),
  width .45s cubic-bezier(.22,.9,.24,1),height .45s cubic-bezier(.22,.9,.24,1),
  opacity .3s,transform .3s,box-shadow .25s,border-color .2s;
  display:flex;flex-direction:column;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(120deg,rgba(79,216,232,.07),transparent 30%,transparent 70%,rgba(168,107,255,.06))}
.card:hover{border-color:var(--line-hi);transform:translateY(-1px)}
body.editing .card{cursor:grab}
body.editing .card:active{cursor:grabbing}
.card.dragging{z-index:70;border-color:var(--cyan);box-shadow:0 24px 70px rgba(79,216,232,.28);transform:scale(1.03)}
.card.focusing{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 30px 80px rgba(79,216,232,.4);z-index:90;transform:scale(1.04)}
body.focusing .card:not(.focusing){opacity:.22;filter:blur(1.5px);pointer-events:none}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0}
.card-head .ttl{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:7px;letter-spacing:.3px}
.card-head .ttl svg{width:13px;height:13px;opacity:.8}
.card-head .ops{display:none;gap:4px}
body.editing .card-head .ops{display:flex}
.op-btn{width:19px;height:19px;border-radius:6px;border:none;background:rgba(255,255,255,.08);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.op-btn:hover{background:var(--cyan);color:#03121a}
.card-body{flex:1;min-height:0;display:flex;flex-direction:column}
.resize-h{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;display:none;
  background:linear-gradient(135deg,transparent 45%,var(--text-faint) 46%,var(--text-faint) 55%,transparent 56%)}
body.editing .resize-h{display:block}
.resize-h:hover{background:linear-gradient(135deg,transparent 45%,var(--cyan) 46%,var(--cyan) 55%,transparent 56%)}

/* 卡片内容 */
.big{font-size:26px;font-weight:700;line-height:1.05}
.kv{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 0;color:var(--text-dim)}
.kv b{color:var(--text);font-weight:500}
.up{color:var(--red)} .down{color:var(--green)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px}
.tag.up{background:rgba(255,91,106,.15);color:var(--red)}
.mini-sub{font-size:10px;color:var(--text-faint);margin-top:auto}
.rank-list{display:flex;flex-direction:column;gap:2px;font-size:11px}
.rank-row{display:flex;justify-content:space-between;padding:2.5px 4px;border-radius:4px}
.rank-row:nth-child(odd){background:rgba(255,255,255,.03)}
.heat{display:grid;gap:2px;flex:1;min-height:0}
.heat i{border-radius:3px}
.arc{width:44px;height:44px;flex-shrink:0}
.ladder{display:flex;gap:5px;margin-top:6px}
.ladder .ld{flex:1;text-align:center;border-radius:7px;padding:3px 0;font-size:10px;background:rgba(255,91,106,.13);color:var(--red)}
.ladder .ld b{display:block;font-size:13px}
.spark{width:100%;height:100%;min-height:24px}
.ai-q{font-size:11.5px;color:var(--text-dim);font-style:italic}
.ai-answer{font-size:11px;line-height:1.55;margin-top:5px;color:var(--text)}
.tl{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--text-dim)}
.tl .t{display:flex;gap:8px;align-items:baseline}
.tl .tm{color:var(--cyan);font-family:Consolas,monospace;font-size:10px;width:38px;flex-shrink:0}

/* ============ 命令面板 ============ */
#palette{position:fixed;left:50%;top:88px;transform:translateX(-50%);width:480px;max-width:92vw;z-index:300;
  background:rgba(12,19,34,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.65);
  backdrop-filter:blur(24px);display:none;overflow:hidden}
#palette.show{display:block;animation:drop .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes drop{from{transform:translateX(-50%) translateY(-8px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.pal-input{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal-input svg{color:var(--cyan);opacity:.8}
.pal-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px}
.pal-input input::placeholder{color:var(--text-faint)}
.pal-input kbd{margin-left:auto;font-size:10px;color:var(--text-faint);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-family:Consolas,monospace}
.pal-body{max-height:380px;overflow-y:auto;padding:8px}
.pal-sec{font-size:10px;color:var(--text-faint);padding:7px 10px 4px;letter-spacing:.5px}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--text-dim);transition:background .12s}
.pal-item .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);flex-shrink:0}
.pal-item .ic svg{width:14px;height:14px}
.pal-item .desc{margin-left:auto;font-size:10.5px;color:var(--text-faint)}
.pal-item.sel{background:rgba(79,216,232,.14);color:var(--text)}
.pal-item.hide{display:none}
.pal-empty{padding:26px;text-align:center;font-size:12px;color:var(--text-faint)}

/* ============ 右侧悬浮导航器 ============ */
#navigator{position:fixed;right:18px;bottom:20px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#navFAB{width:46px;height:46px;border-radius:50%;border:1px solid var(--cyan-dim);background:rgba(10,16,30,.9);
  color:var(--cyan);font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:all .2s;
  display:flex;align-items:center;justify-content:center}
#navFAB:hover{background:var(--cyan);color:#03121a}
#navFAB .c{font-size:9px;font-weight:400;opacity:.7}
#navPanel{width:190px;background:rgba(11,18,32,.96);border:1px solid var(--line);border-radius:14px;padding:8px;
  display:none;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(20px)}
#navPanel.show{display:block;animation:pop2 .2s ease}
@keyframes pop2{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.nav-item-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .15s}
.nav-item-row:hover{background:rgba(79,216,232,.1);color:var(--text)}
.nav-item-row.on{background:rgba(79,216,232,.14);color:var(--cyan)}
.nav-item-row .idx{width:17px;height:17px;border-radius:5px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:Consolas,monospace;flex-shrink:0}
.nav-item-row.on .idx{background:rgba(79,216,232,.22);color:var(--cyan)}

/* ============ 卡片库抽屉 ============ */
#library{position:fixed;right:0;top:52px;bottom:0;width:210px;z-index:140;transform:translateX(100%);
  background:rgba(10,16,30,.97);border-left:1px solid var(--cyan-dim);padding:14px 12px;transition:transform .32s cubic-bezier(.22,.9,.24,1);
  overflow-y:auto;backdrop-filter:blur(16px)}
body.editing #library{transform:translateX(0)}
#library h4{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-bottom:10px;letter-spacing:.5px}
.lib-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;
  font-size:12px;color:var(--text-dim);cursor:pointer;transition:all .18s;background:rgba(255,255,255,.02)}
.lib-item:hover{border-color:var(--cyan);color:var(--text)}
.lib-item .add{margin-left:auto;color:var(--cyan);font-size:15px;line-height:1}

/* ============ 编排工具条 ============ */
#editBar{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:250;display:none;align-items:center;gap:8px;
  background:rgba(13,21,38,.96);border:1px solid var(--cyan-dim);border-radius:22px;padding:5px 14px;font-size:12px;
  box-shadow:0 12px 44px rgba(0,0,0,.55);backdrop-filter:blur(14px)}
body.editing #editBar{display:flex}
#editBar button{background:transparent;border:none;color:var(--text-dim);padding:4px 10px;border-radius:14px;font-size:12px;transition:all .18s}
#editBar button:hover{color:var(--cyan);background:rgba(79,216,232,.1)}
#editBar button.primary{background:var(--cyan);color:#03121a;font-weight:600}
#editBar .hint{font-size:11px;color:var(--text-faint);padding-right:6px}

/* ============ Toast / 状态 ============ */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:400;background:rgba(13,21,38,.97);
  border:1px solid var(--cyan-dim);padding:8px 18px;border-radius:20px;font-size:12px;color:var(--cyan);
  display:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.show{display:block;animation:up .3s ease}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(79,216,232,.1);
  border:1px solid var(--cyan-dim);color:var(--cyan);font-size:11.5px;padding:6px 14px;border-radius:16px;display:none}

/* ============ 响应式 ============ */
@media(max-width:860px){
  .kbd-hint{display:none}
  #navigator{right:12px;bottom:12px}
}
@media(max-width:720px){
  #rail{display:none}
  #stage{left:0}
  :root{--cellH:54px;--gap:8px;--pad:10px}
  .island{max-width:46vw;overflow:hidden}
  .island .quick{display:none}
  #palette{top:64px;width:94vw}
  #library{width:70vw}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4fd8e8" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg>
    Tick<b>Gold</b>
  </div>
  <div class="island" id="island">
    <div class="cur"><span class="dot"></span><span id="islandCur">盘中盯盘</span></div>
    <span class="caret">▼</span>
    <div class="quick">
      <button data-q="edit" id="qEdit">编排</button>
      <button data-q="auto">整理</button>
      <button data-q="save">存布局</button>
    </div>
    <div class="island-menu" id="islandMenu"></div>
  </div>
  <div class="top-right">
    <div class="kbd-hint"><kbd>⌘</kbd><kbd>K</kbd> 命令</div>
    <div class="live"><span class="live-dot"></span>实时</div>
    <div class="clock num" id="clock">--:--:--</div>
  </div>
</div>

<!-- ===== 左侧图标栏 ===== -->
<div id="rail"></div>

<!-- ===== 舞台 ===== -->
<div id="stage">
  <div id="board">
    <div id="gridOverlay"></div>
    <div id="ghost"></div>
  </div>
</div>
<div id="dimLayer"></div>

<!-- ===== 命令面板 ===== -->
<div id="palette">
  <div class="pal-input">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="palInput" placeholder="输入卡片 / 场景 / 操作…">
    <kbd>ESC</kbd>
  </div>
  <div class="pal-body" id="palBody"></div>
</div>

<!-- ===== 编排工具条 ===== -->
<div id="editBar">
  <span class="hint">拖拽磁吸 · 角部拉伸 · 或从右侧卡片库拖入</span>
  <button id="btnAuto">自动整理</button>
  <button id="btnSave">保存布局</button>
  <button class="primary" id="btnDone">完成编排</button>
</div>

<!-- ===== 卡片库 ===== -->
<div id="library">
  <h4>卡片库 · 点击添加</h4>
  <div id="libItems"></div>
</div>

<!-- ===== 右侧悬浮导航器 ===== -->
<div id="navigator">
  <div id="navPanel"></div>
  <button id="navFAB"><span class="c" id="fabCount">9</span><br>卡片</button>
</div>

<div id="toast"></div>
<div id="hint">按 ⌘K 呼出命令面板 · 或双击卡片标题进入编排</div>

<script>
/* ============================================================
   TickGold 灵动岛命令中心 · 工作台原型
   菜单收进灵动岛胶囊；切换靠 ⌘K 命令面板 + 数字键 + 悬浮导航器
   ============================================================ */
const GRID={cols:8,cellH:60,gap:12,pad:14};
const $=id=>document.getElementById(id);
const MOBILE=()=>window.innerWidth<760;
function cols(){return MOBILE()?2:GRID.cols;}
function cw(id){return MOBILE()?2:cards[id].w;}
function ch(id){return MOBILE()?cards[id].h+1:cards[id].h;}

const cards={};let order=[];let scene='intraday';
let drag=null,resize=null,focusId=null;

function colW(){const b=$('board');const c=cols();return(b.clientWidth-GRID.pad*2-GRID.gap*(c-1))/c;}
function xOf(c){return GRID.pad+c*(colW()+GRID.gap);}
function yOf(r){return GRID.pad+r*(GRID.cellH+GRID.gap);}
function boardH(){let m=0;order.forEach(id=>{const c=cards[id];if(c.visible)m=Math.max(m,c.row+ch(id));});
  return GRID.pad*2+m*(GRID.cellH+GRID.gap)-GRID.gap;}
function firstFree(c,occ){
  const w=cw(c.id),h=ch(c.id);
  for(let r=0;r<64;r++)for(let col=0;col<=cols()-w;col++){
    let ok=true;
    for(let dr=0;dr<h&&ok;dr++)for(let dc=0;dc<w;dc++){if(occ.has((r+dr)+','+(col+dc))){ok=false;break;}}
    if(ok)return{col,row:r};
  }
  return{col:0,row:0};
}
function reflow(ids,fixed={}){
  const occ=new Set();const res={};
  ids.forEach(id=>{
    const c=cards[id];
    const w=cw(id),h=ch(id);
    let pos;
    if(fixed[id])pos={col:Math.min(fixed[id].col,cols()-w),row:Math.max(0,fixed[id].row)};
    else pos=firstFree(c,occ);
    c.col=pos.col;c.row=pos.row;
    for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++)occ.add((c.row+dr)+','+(c.col+dc));
    res[id]=pos;
  });
  return res;
}
function renderBoard(){
  const b=$('board');
  order.forEach(id=>{
    const c=cards[id];if(!c.visible)return;
    let el=c.el;
    if(!el){
      el=document.createElement('div');el.className='card';el.dataset.id=id;
      el.innerHTML=`<div class="card-head"><span class="ttl"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>${DEFS[id].t}</span>
        <div class="ops"><button class="op-btn" data-op="remove" title="移除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px;height:10px"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></div>
        <div class="card-body">${DEFS[id].body}</div>
        <div class="resize-h" title="拖拽调整尺寸"></div>`;
      c.el=el;
      el.querySelector('[data-op="remove"]')&&el.querySelector('[data-op="remove"]').addEventListener('click',e=>{e.stopPropagation();removeCard(id);});
      attachCard(el,id);
      el.addEventListener('click',e=>{
        if(document.body.classList.contains('editing'))return;
        if(e.target.closest('.op-btn'))return;
        focusCard(id);
      });
      b.appendChild(el);
    }
    el.style.display='';
    el.style.width=cw(id)*colW()+(cw(id)-1)*GRID.gap+'px';
    el.style.height=ch(id)*GRID.cellH+(ch(id)-1)*GRID.gap+'px';
    el.style.left=xOf(c.col)+'px';el.style.top=yOf(c.row)+'px';
    if(!el._heat){const g=el.querySelector('#heatGrid');if(g){el._heat=1;
      const colors=['#ff5b6a','#f5a623','#22c55e','#4fd8e8','#a86bff'];
      g.innerHTML='';for(let i=0;i<30;i++){const d=document.createElement('i');
        d.style.background=colors[Math.floor(Math.random()*5)];
        d.style.opacity=(0.25+Math.random()*0.7).toFixed(2);g.appendChild(d);}}}
  });
  Object.values(cards).forEach(c=>{if(!c.visible&&c.el)c.el.style.display='none';});
  b.style.height=boardH()+'px';
  renderNavPanel();
}

function cellFromEvent(e){
  const b=$('board'),r=b.getBoundingClientRect();
  const col=Math.round((e.clientX-r.left-GRID.pad)/(colW()+GRID.gap));
  const row=Math.round((e.clientY-r.top-GRID.pad)/(GRID.cellH+GRID.gap));
  return{col:Math.max(0,Math.min(col,cols()-1)),row:Math.max(0,row)};
}
function attachCard(el,id){
  el.addEventListener('mousedown',e=>{
    if(!document.body.classList.contains('editing'))return;
    if(e.target.closest('.op-btn')||e.target.closest('.resize-h'))return;
    const c=cards[id];
    drag={id,ox:e.clientX,oy:e.clientY,cell:{col:c.col,row:c.row}};
    el.classList.add('dragging');
    const g=$('ghost');
    g.style.display='block';
    g.style.width=cw(id)*colW()+(cw(id)-1)*GRID.gap+'px';
    g.style.height=ch(id)*GRID.cellH+(ch(id)-1)*GRID.gap+'px';
    g.style.left=xOf(c.col)+'px';g.style.top=yOf(c.row)+'px';
    e.preventDefault();
  });
  const rh=el.querySelector('.resize-h');
  rh.addEventListener('mousedown',e=>{
    if(!document.body.classList.contains('editing'))return;
    e.stopPropagation();
    const c=cards[id];
    resize={id,sx:e.clientX,sy:e.clientY,ow:c.w,oh:c.h};
    el.classList.add('dragging');
    e.preventDefault();
  });
}
window.addEventListener('mousemove',e=>{
  if(drag){
    const c=cards[drag.id];
    const cell=cellFromEvent(e);
    const col=Math.max(0,Math.min(cell.col,cols()-cw(drag.id)));
    const row=Math.max(0,cell.row);
    if(col===drag.cell.col&&row===drag.cell.row)return;
    drag.cell={col,row};
    const others=order.filter(x=>x!==drag.id).slice();
    others.sort((a,b)=>(cards[a].row-cards[b].row)||(cards[a].col-cards[b].col));
    let idx=others.findIndex(x=>cards[x].row>row||(cards[x].row===row&&cards[x].col>col));
    if(idx<0)idx=others.length;
    order=others.slice(0,idx).concat([drag.id]).concat(others.slice(idx));
    const fixed={};fixed[drag.id]={col,row};
    reflow(order,fixed);
    renderBoard();
    const g=$('ghost');g.style.left=xOf(col)+'px';g.style.top=yOf(row)+'px';
  }
  if(resize){
    const c=cards[resize.id];
    const cw2=colW()+GRID.gap,ch2=GRID.cellH+GRID.gap;
    const w=Math.max(1,Math.min(resize.ow+Math.round((e.clientX-resize.sx)/cw2),MOBILE()?2:GRID.cols-c.col));
    const h=Math.max(1,Math.min(resize.oh+Math.round((e.clientY-resize.sy)/ch2),12));
    if(w===c.w&&h===c.h)return;
    c.w=w;c.h=h;c.col=Math.min(c.col,GRID.cols-w);
    const fixed={};fixed[resize.id]={col:c.col,row:c.row};
    reflow(order,fixed);renderBoard();
  }
});
window.addEventListener('mouseup',()=>{
  if(drag){drag.el&&drag.el.classList.remove('dragging');$('ghost').style.display='none';drag=null;}
  if(resize){const el=cards[resize.id]&&cards[resize.id].el;el&&el.classList.remove('dragging');resize=null;toast('尺寸已调整');}
});

/* ---------- 聚焦 / 切换 ---------- */
function focusCard(id){
  if(!cards[id]||!cards[id].visible)return;
  exitFocus();
  const el=cards[id].el;
  const stage=$('stage');
  const top=yOf(cards[id].row)+ch(id)*GRID.cellH/2-stage.clientHeight/2;
  stage.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  setTimeout(()=>{
    el.classList.add('focusing');
    document.body.classList.add('focusing');
    focusId=id;
  },380);
}
function exitFocus(){
  document.body.classList.remove('focusing');
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('focusing'));
  focusId=null;
}
$('dimLayer').addEventListener('click',exitFocus);
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){exitFocus();closePalette();}
  const n=parseInt(e.key);
  if(n>=1&&n<=9){const list=order.filter(id=>cards[id].visible);if(list[n-1])focusCard(list[n-1]);}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();togglePalette();}
});

/* ---------- 命令面板 ---------- */
function togglePalette(){
  const p=$('palette');
  if(p.classList.contains('show')){closePalette();return;}
  p.classList.add('show');
  const inp=$('palInput');inp.value='';renderPalette('');inp.focus();
}
function closePalette(){$('palette').classList.remove('show');}
function renderPalette(q){
  const box=$('palBody');
  const items=[];
  SCENES.forEach(s=>items.push({sec:'场景',t:s.name,d:s.cards.length+' 张卡片',icon:'M12 2a7 7 0 017 7c0 3-2 5-3 7h-8c-1-2-3-4-3-7a7 7 0 017-7z',run:()=>switchScene(s.key)}));
  order.filter(id=>cards[id].visible).forEach((id,i)=>{
    items.push({sec:'卡片',t:DEFS[id].t,d:'数字键 '+((i%9)+1),icon:'M4 4h16v16H4z',run:()=>focusCard(id)});
  });
  ACTIONS.forEach(a=>items.push({sec:'操作',t:a.t,d:a.desc,icon:a.icon,run:a.run}));
  box.innerHTML='';
  let shown=0;
  const ql=q.toLowerCase();
  items.forEach((it,i)=>{
    const row=document.createElement('div');
    row.className='pal-item'+(i===0?' sel':'')+(it.sec==='场景'?' sec-item':'')+(it.sec==='操作'?' act-item':'');
    row.dataset.i=i;
    row.innerHTML=`<span class="ic"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${it.icon}"/></svg></span>${it.t}<span class="desc">${it.d}</span>`;
    const hit=ql&&!(it.t.toLowerCase().includes(ql)||it.sec.includes(ql));
    row.classList.toggle('hide',hit);
    row.addEventListener('mousemove',()=>{
      document.querySelectorAll('.pal-item').forEach(x=>x.classList.remove('sel'));
      row.classList.add('sel');
    });
    row.addEventListener('click',()=>{closePalette();it.run();});
    box.appendChild(row);
    if(!hit)shown++;
  });
  if(!shown)box.innerHTML='<div class="pal-empty">没有匹配结果 · 试试「涨停」或「编排」</div>';
  $('palInput').oninput=e=>renderPalette(e.target.value);
  $('palInput').onkeydown=e=>{
    if(e.key==='Enter'){
      const sel=box.querySelector('.pal-item.sel:not(.hide)');
      if(sel){const it=items[+sel.dataset.i];closePalette();it.run();}
    }else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const vis=[...box.querySelectorAll('.pal-item:not(.hide)')];
      const cur=box.querySelector('.pal-item.sel');
      const ci=vis.indexOf(cur);
      const ni=e.key==='ArrowDown'?(ci+1)%vis.length:(ci-1+vis.length)%vis.length;
      vis.forEach(x=>x.classList.remove('sel'));
      vis[ni]&&vis[ni].classList.add('sel');
    }
  };
}

/* ---------- 场景 / 卡片库 / 编排 ---------- */
function switchScene(key){
  scene=key;
  const s=SCENES.find(x=>x.key===key);
  $('islandCur').textContent=s.name;
  renderIslandMenu();
  order=[];
  Object.values(cards).forEach(c=>c.visible=false);
  s.cards.forEach(id=>{
    if(!cards[id])cards[id]={id,t:DEFS[id].t,w:DEFS[id].w,h:DEFS[id].h,col:0,row:0,visible:true};
    cards[id].visible=true;order.push(id);
  });
  const fixed={};
  if(!MOBILE())Object.entries(s.pos).forEach(([id,p])=>{if(cards[id])fixed[id]={col:p.c,row:p.r};});
  reflow(order,fixed);
  renderBoard();
  exitFocus();
  toast(`${s.name} · ${s.cards.length} 张卡片`);
}
function addCard(id){
  if(cards[id]&&cards[id].visible){toast('卡片已在工作台');return;}
  if(!cards[id])cards[id]={id,t:DEFS[id].t,w:DEFS[id].w,h:DEFS[id].h,col:0,row:0,visible:true};
  cards[id].visible=true;order.push(id);
  reflow(order);renderBoard();
  toast(`已添加「${DEFS[id].t}」`);
}
function removeCard(id){
  cards[id].visible=false;
  order=order.filter(x=>x!==id);
  reflow(order);renderBoard();
  toast(`已移除「${DEFS[id].t}」`);
  if(focusId===id)exitFocus();
}
function setEditing(on){
  document.body.classList.toggle('editing',on);
  $('qEdit').textContent=on?'完成':'编排';
  if(!on){$('ghost').style.display='none';drag=null;resize=null;}
  $('hint').style.display=on?'none':'block';
}

$('island').addEventListener('click',e=>{
  if(e.target.closest('.quick button'))return;
  if(e.target.closest('.im-item'))return;
  $('island').classList.toggle('open');
});
function renderIslandMenu(){
  const m=$('islandMenu');m.innerHTML='';
  m.innerHTML='<div class="im-t">切换场景</div>';
  SCENES.forEach(s=>{
    const d=document.createElement('div');
    d.className='im-item'+(s.key===scene?' active':'');
    d.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 017 7c0 3-2 5-3 7h-8c-1-2-3-4-3-7a7 7 0 017-7z"/></svg>${s.name}<span class="cnt">${s.cards.length} 卡</span>`;
    d.addEventListener('click',()=>{switchScene(s.key);$('island').classList.remove('open');});
    m.appendChild(d);
  });
  m.innerHTML+='<div class="im-t">快捷</div>';
  [['编排','M4 6h16M4 12h16M4 18h10',()=>setEditing(true)],
   ['自动整理','M3 3v18h18',()=>toast('已自动整理到预设栅格')],
   ['保存布局','M12 3v10m0 0l-4-4m4 4l4-4M4 19h16',()=>toast('布局已保存')]].forEach(([t,icon,run])=>{
    const d=document.createElement('div');d.className='im-item';
    d.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${icon}"/></svg>${t}`;
    d.addEventListener('click',()=>{run();$('island').classList.remove('open');});
    m.appendChild(d);
  });
}
document.querySelectorAll('.quick button').forEach(b=>{
  b.addEventListener('click',()=>{
    const q=b.dataset.q;
    if(q==='edit')setEditing(!document.body.classList.contains('editing'));
    if(q==='auto')toast('已自动整理到预设栅格');
    if(q==='save')toast('布局已保存');
  });
});

/* ---------- 悬浮导航器 ---------- */
function renderNavPanel(){
  const p=$('navPanel');p.innerHTML='';
  order.filter(id=>cards[id].visible).forEach((id,i)=>{
    const d=document.createElement('div');d.className='nav-item-row';d.dataset.card=id;
    d.innerHTML=`<span class="idx">${(i%9)+1}</span>${DEFS[id].t}`;
    d.addEventListener('click',()=>focusCard(id));
    p.appendChild(d);
  });
  $('fabCount').textContent=order.filter(id=>cards[id].visible).length;
}
$('navFAB').addEventListener('click',()=>$('navPanel').classList.toggle('show'));

/* ---------- 左侧图标栏 ---------- */
(function(){
  const items=[['market','大盘','M3 17l6-6 4 4 8-8M14 7h7v7'],['watch','盯盘','M12 7v5l3 2'],
    ['emo','情绪','M12 2a7 7 0 017 7c0 3-2 5-3 7h-8c-1-2-3-4-3-7a7 7 0 017-7z'],
    ['sector','板块','M3 3v18h18M3 9h18M3 15h18'],['stock','个股','M4 20V10M10 20V4M16 20v-8M22 20H2'],['trade','交易','M3 3v18h18M7 14l4-4 4 4 5-5']];
  const box=$('rail');
  items.forEach(([k,lbl,path],i)=>{
    const d=document.createElement('div');d.className='rail-item'+(i===0?' active':'');
    d.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="${path}"/></svg>
      <span class="tip">${lbl}</span>`;
    d.addEventListener('click',()=>{
      document.querySelectorAll('.rail-item').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      toast(`${lbl}视图 · 命令面板可精确切换`);
    });
    box.appendChild(d);
  });
  const sep=document.createElement('div');sep.className='rail-sep';box.appendChild(sep);
  const ai=document.createElement('div');ai.className='rail-item';
  ai.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="tip">AI 助手</span>`;
  ai.addEventListener('click',()=>toast('AI 助手演示 · 已生成盘中研判'));
  box.appendChild(ai);
})();

/* ---------- 卡片库 ---------- */
(function(){
  const box=$('libItems');
  ['sp','tc','tick'].forEach(id=>{
    const d=document.createElement('div');d.className='lib-item';
    d.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>${DEFS[id].t}<span class="add">+</span>`;
    d.addEventListener('click',()=>addCard(id));
    box.appendChild(d);
  });
})();

/* ---------- 工具条 & 杂项 ---------- */
$('btnAuto').addEventListener('click',()=>{
  const s=SCENES.find(x=>x.key===scene);
  const fixed={};if(!MOBILE())Object.entries(s.pos).forEach(([id,p])=>{if(cards[id]&&cards[id].visible)fixed[id]={col:p.c,row:p.r};});
  reflow(order,fixed);renderBoard();toast('已自动整理到预设栅格');
});
$('btnSave').addEventListener('click',()=>toast('布局已保存'));
$('btnDone').addEventListener('click',()=>{setEditing(false);toast('编排已保存到当前场景');});
document.addEventListener('dblclick',e=>{
  if(e.target.closest('.card-head'))setEditing(!document.body.classList.contains('editing'));
});
setInterval(()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
},1000);
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1900);
}
window.addEventListener('resize',()=>{reflow(order);renderBoard();});

/* ---------- 启动 ---------- */
renderIslandMenu();
switchScene('intraday');
setTimeout(()=>{toast('按 ⌘K / Ctrl+K 呼出命令面板，数字键 1-9 快速切换卡片');},1200);
setTimeout(()=>{$('hint').style.display='none';},6000);
</script>
</body>
</html>
