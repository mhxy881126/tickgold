<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>右侧分组导航 · 交互原型</title>
<style>
:root{
  --bg:#07080a; --panel:#0c0e12; --card:#11141a; --line:#1e2330;
  --text:#eef2f8; --dim:#8b97a8; --gold:#e8b860; --up:#ff4d6a; --down:#00d4a0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;height:100vh;overflow:hidden}

/* 主卡区 */
.main{
  flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;
}
.mock-card{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;
  position:relative;overflow:hidden;
}
.mock-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(600px 300px at 50% 0%, rgba(232,184,96,.06), transparent 60%);
}

/* 右侧导航 */
.nav{
  width:240px;flex:none;background:rgba(12,14,18,.9);
  backdrop-filter:blur(20px);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.nav-head{
  padding:14px 16px 10px;border-bottom:1px solid var(--line);
}
.nav-title{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:600}
.nav-sub{font-size:10px;color:var(--dim);margin-top:2px}

.nav-body{flex:1;overflow-y:auto;padding:8px}
.nav-body::-webkit-scrollbar{width:4px}
.nav-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

/* 分组 */
.group{margin-bottom:4px}
.group-head{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  cursor:pointer;border-radius:8px;transition:background .15s;
  user-select:none;
}
.group-head:hover{background:rgba(255,255,255,.04)}
.group-icon{
  width:24px;height:24px;border-radius:6px;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
}
.group-name{font-size:12px;font-weight:600;flex:1}
.group-count{
  font-size:10px;color:var(--dim);background:rgba(255,255,255,.06);
  padding:1px 6px;border-radius:8px;
}
.group-arrow{
  font-size:10px;color:var(--dim);transition:transform .2s;
}
.group.open .group-arrow{transform:rotate(90deg)}

.group-items{
  overflow:hidden;max-height:0;transition:max-height .25s ease;
}
.group.open .group-items{max-height:500px}

/* 卡片项 */
.item{
  display:flex;align-items:center;gap:8px;padding:7px 10px 7px 42px;
  cursor:pointer;border-radius:6px;font-size:11.5px;color:var(--dim);
  transition:all .15s;position:relative;
}
.item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.item.on{
  background:rgba(232,184,96,.1);color:var(--gold);
}
.item.on::before{
  content:"";position:absolute;left:28px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 8px var(--gold);
}
.item .item-dot{
  width:6px;height:6px;border-radius:50%;flex:none;
}
.item .item-badge{
  margin-left:auto;font-size:9px;padding:1px 5px;border-radius:4px;
  background:rgba(255,77,106,.15);color:var(--up);
}

/* 磁吸提示线 */
.magnet-line{
  height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin:2px 0;border-radius:1px;opacity:0;transition:opacity .15s;
}
.magnet-line.show{opacity:1}

/* 底部快捷操作 */
.nav-foot{
  padding:10px 12px;border-top:1px solid var(--line);
  display:flex;gap:6px;
}
.nav-btn{
  flex:1;padding:6px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:10px;cursor:pointer;
  text-align:center;transition:all .15s;
}
.nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.nav-btn.primary{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}

/* 演示提示 */
.hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(232,184,96,.1);border:1px solid rgba(232,184,96,.3);
  padding:8px 16px;border-radius:20px;font-size:11px;color:var(--gold);
}
</style>
</head>
<body>

<div class="main">
  <div class="mock-card">
    主卡区域 · 点击右侧导航切换
  </div>
</div>

<div class="nav">
  <div class="nav-head">
    <div class="nav-title">卡片导航</div>
    <div class="nav-sub">8 张已开 · 6 个分组</div>
  </div>
  <div class="nav-body">

    <!-- 大盘总览 -->
    <div class="group open">
      <div class="group-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="group-icon">📊</div>
        <div class="group-name">大盘总览</div>
        <div class="group-count">2</div>
        <div class="group-arrow">▶</div>
      </div>
      <div class="group-items">
        <div class="item on">
          <span class="item-dot" style="background:var(--up)"></span>
          自选股
        </div>
        <div class="item">
          <span class="item-dot" style="background:var(--gold)"></span>
          榜单
        </div>
      </div>
    </div>

    <!-- 盯盘模式 -->
    <div class="group open">
      <div class="group-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="group-icon">🔍</div>
        <div class="group-name">盯盘模式</div>
        <div class="group-count">2</div>
        <div class="group-arrow">▶</div>
      </div>
      <div class="group-items">
        <div class="item">
          <span class="item-dot" style="background:var(--up)"></span>
          雷达扫盘
          <span class="item-badge">48</span>
        </div>
        <div class="item">
          <span class="item-dot" style="background:var(--down)"></span>
          复盘时间线
        </div>
      </div>
    </div>

    <!-- 情绪异动 -->
    <div class="group">
      <div class="group-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="group-icon">⚡</div>
        <div class="group-name">情绪异动</div>
        <div class="group-count">0</div>
        <div class="group-arrow">▶</div>
      </div>
      <div class="group-items">
        <div class="item" style="opacity:.4">
          <span class="item-dot" style="background:var(--line)"></span>
          集合竞价
        </div>
        <div class="item" style="opacity:.4">
          <span class="item-dot" style="background:var(--line)"></span>
          涨停池明细
        </div>
      </div>
    </div>

    <!-- 交易工具 -->
    <div class="group open">
      <div class="group-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="group-icon">💼</div>
        <div class="group-name">交易工具</div>
        <div class="group-count">4</div>
        <div class="group-arrow">▶</div>
      </div>
      <div class="group-items">
        <div class="item">
          <span class="item-dot" style="background:var(--gold)"></span>
          AI 问数
        </div>
        <div class="item">
          <span class="item-dot" style="background:var(--gold)"></span>
          AI 复盘
        </div>
        <div class="item">
          <span class="item-dot" style="background:var(--up)"></span>
          作战计划
        </div>
        <div class="item">
          <span class="item-dot" style="background:var(--up)"></span>
          决策日志
        </div>
      </div>
    </div>

  </div>
  <div class="nav-foot">
    <button class="nav-btn">+ 加卡片</button>
    <button class="nav-btn primary">布局</button>
  </div>
</div>

<div class="hint">点击分组标题折叠/展开 · 点击卡片切换主卡 · 已开卡片金色高亮</div>

</body>
</html>
