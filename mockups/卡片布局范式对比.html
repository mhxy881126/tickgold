<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TickGold · 卡片布局范式对比</title>
<style>
:root{
  --bg:#07080a; --bg2:#0b0d11; --panel:#0e1116;
  --ink:#e8ecf1; --ink2:#8b94a3; --ink3:#565e6c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --up:#ff4d6a; --down:#00d4a0; --gold:#e8b860;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  font-feature-settings:"tnum" 1;overflow:hidden}
.up{color:var(--up)} .down{color:var(--down)}

.app{height:100vh;display:flex;flex-direction:column}

/* 顶栏 */
.tbar{height:48px;flex:none;display:flex;align-items:center;padding:0 16px;gap:16px;
  border-bottom:1px solid var(--line);background:rgba(0,0,0,.2);z-index:20}
.logo{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:13px}
.modes{display:flex;gap:4px;margin-left:12px;background:var(--panel);padding:3px;border-radius:8px;border:1px solid var(--line)}
.mode{font-size:11.5px;padding:5px 14px;border-radius:6px;color:var(--ink2);cursor:pointer;border:0;background:transparent}
.mode.on{background:var(--gold);color:#000;font-weight:700}
.mode:not(.on):hover{color:var(--ink)}
.mode-desc{margin-left:auto;font-size:11px;color:var(--ink3)}

/* 主区 */
.main{flex:1;position:relative;overflow:hidden;background:var(--bg2)}

/* 卡片基础 */
.card{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 22%),
             linear-gradient(180deg, #17130b, #120f08);
  border:1px solid var(--line);border-radius:10px;
  transition:box-shadow .2s, border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card .card-bar{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent))}
.card .ch{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;
  font-size:11.5px;color:var(--ink);cursor:grab;user-select:none;min-height:28px}
.card .ch .tt{font-weight:600;white-space:nowrap}
.card .ch .spacer{flex:1}
.card .cb{flex:1;padding:6px 10px 10px;overflow:hidden;position:relative;min-height:0}

/* srow */
.srow{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;
  padding:3.5px 2px;border-bottom:1px dashed rgba(255,255,255,.04)}
.srow:last-child{border-bottom:0}
.srow .nm{color:var(--ink)} .srow .nm small{color:var(--ink3);margin-left:4px;font-size:9px;font-family:monospace}
.srow .pr{font-weight:600}

/* ============ 模式 1: Bento 平铺 ============ */
#mode-bento{position:absolute;inset:0;display:grid;gap:10px;padding:14px;
  grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,1fr)}
#mode-bento .card{position:relative}

/* ============ 模式 2: Master-Detail ============ */
#mode-master{position:absolute;inset:0;display:flex;gap:10px;padding:14px}
#mode-master .master{flex:1;position:relative;min-width:0}
#mode-master .satellites{width:260px;flex:none;display:flex;flex-direction:column;gap:10px}
#mode-master .sat{flex:1;position:relative;cursor:pointer}
#mode-master .sat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#mode-master .sat.on::after{content:"主";position:absolute;top:6px;right:8px;
  width:16px;height:16px;border-radius:50%;background:var(--gold);color:#000;
  font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ============ 模式 3: 自由画布 ============ */
#mode-canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:24px 24px}
#mode-canvas.dragging{cursor:grabbing}
#mode-canvas .card{cursor:default}
#mode-canvas .card .ch{cursor:grab}
.canvas-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(20,22,28,.9);border:1px solid var(--line2);color:var(--ink2);
  padding:5px 14px;border-radius:6px;font-size:11px;pointer-events:none;z-index:10}

/* ============ 模式 4: Deck 堆叠 ============ */
#mode-deck{position:absolute;inset:0}
#mode-deck .stack{position:absolute;width:560px;height:420px;left:50%;top:50%;
  transform:translate(-50%,-50%);cursor:pointer}
#mode-deck .stack .card{position:absolute;inset:0;transition:transform .35s cubic-bezier(.32,.72,0,1), box-shadow .3s}
#mode-deck .stack .card:nth-child(1){transform:translate(0,0) rotate(0deg);z-index:5}
#mode-deck .stack .card:nth-child(2){transform:translate(14px,14px) rotate(2deg);z-index:4}
#mode-deck .stack .card:nth-child(3){transform:translate(28px,28px) rotate(4deg);z-index:3}
#mode-deck .stack .card:nth-child(4){transform:translate(42px,42px) rotate(6deg);z-index:2;opacity:.7}
#mode-deck .stack .card:nth-child(5){transform:translate(56px,56px) rotate(8deg);z-index:1;opacity:.5}
#mode-deck .stack.peek .card:nth-child(1){transform:translate(-200px,0) rotate(-8deg)}
#mode-deck .deck-nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;z-index:10}
#mode-deck .deck-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);
  background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px}
#mode-deck .deck-nav button:hover{border-color:var(--gold);color:var(--gold)}
#mode-deck .deck-nav .dots{display:flex;gap:5px}
#mode-deck .deck-nav .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
#mode-deck .deck-nav .dot.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="tbar">
    <span class="logo">TickGold</span>
    <div class="modes" id="modeTabs">
      <button class="mode on" data-m="bento">▦ Bento 平铺</button>
      <button class="mode" data-m="master">◉ 主从聚焦</button>
      <button class="mode" data-m="canvas">◌ 自由画布</button>
      <button class="mode" data-m="deck">▤ Deck 堆叠</button>
    </div>
    <span class="mode-desc" id="modeDesc">所有卡片同屏平铺，全景总览</span>
  </div>
  <div class="main" id="main">
    <div id="mode-bento"></div>
    <div id="mode-master" class="hidden"></div>
    <div id="mode-canvas" class="hidden">
      <div class="canvas-hint">拖拽空白处平移画布 · 拖动卡片标题栏移动卡片位置</div>
    </div>
    <div id="mode-deck" class="hidden"></div>
  </div>
</div>

<script>
const CARDS = [
  {id:"chart",title:"K线图",accent:"#2f6fed"},
  {id:"radar",title:"涨停雷达",accent:"#e0455a"},
  {id:"watch",title:"自选股",accent:"#26d07c"},
  {id:"spider",title:"短线精灵",accent:"#e0556b"},
  {id:"sectorevent",title:"板块异动",accent:"#e0556b"},
];

function bodyHTML(id){
  switch(id){
    case "chart": return `
      <div style="font-size:18px;font-weight:700;color:var(--up)">152.30 <span style="font-size:11px">+4.56%</span></div>
      <svg width="100%" height="90%" viewBox="0 0 400 200" preserveAspectRatio="none" style="margin-top:6px">
        <g stroke="#ff4d6a" fill="#ff4d6a">
          <line x1="40" y1="120" x2="40" y2="160"/><rect x="34" y="130" width="12" height="20"/>
          <line x1="140" y1="100" x2="140" y2="140"/><rect x="134" y="110" width="12" height="25"/>
          <line x1="240" y1="70" x2="240" y2="110"/><rect x="234" y="80" width="12" height="25"/>
          <line x1="340" y1="40" x2="340" y2="80"/><rect x="334" y="50" width="12" height="25"/>
        </g>
        <polyline points="40,150 140,130 240,100 340,70" fill="none" stroke="#e8b860" stroke-width="1.2"/>
      </svg>`;
    case "radar": return `
      <div class="srow"><span style="color:#e0455a;font-weight:700">5板</span><span class="nm">鸿博股份</span><span class="pr up">+10.02%</span></div>
      <div class="srow"><span style="color:#e0455a;font-weight:700">4板</span><span class="nm">拓维信息</span><span class="pr up">+10.00%</span></div>
      <div class="srow"><span style="color:#e0455a;font-weight:700">3板</span><span class="nm">四川长虹</span><span class="pr up">+9.98%</span></div>
      <div style="margin-top:6px;font-size:9.5px;color:var(--ink2)">涨停 <b class="up">47</b> · 炸板 <b class="down">8</b> · 封板率 <b>85%</b></div>`;
    case "watch": return `
      <div class="srow"><span class="nm">贵州茅台<small>600519</small></span><span class="pr up">1685.00 +1.23%</span></div>
      <div class="srow"><span class="nm">中际旭创<small>300308</small></span><span class="pr up">152.30 +4.56%</span></div>
      <div class="srow"><span class="nm">宁德时代<small>300750</small></span><span class="pr down">187.45 -0.85%</span></div>
      <div class="srow"><span class="nm">比亚迪<small>002594</small></span><span class="pr down">245.60 -1.12%</span></div>`;
    case "spider": return `
      <div class="srow"><span class="nm"><span class="up">▲火箭</span> 中际旭创</span><span class="pr up">+4.56%</span></div>
      <div class="srow"><span class="nm"><span style="color:var(--gold)">●大买</span> 新易盛</span><span class="pr up">+3.88%</span></div>
      <div class="srow"><span class="nm"><span class="up">▲火箭</span> 天孚通信</span><span class="pr up">+3.21%</span></div>`;
    case "sectorevent": return `
      <div class="srow"><span class="nm"><span class="up">10:24 拉升</span> CPO 概念</span><span class="pr up">+3.12%</span></div>
      <div class="srow"><span class="nm"><span class="up">10:18 拉升</span> 算力租赁</span><span class="pr up">+2.44%</span></div>
      <div class="srow"><span class="nm"><span class="up">10:05 异动</span> 半导体设备</span><span class="pr up">+1.70%</span></div>`;
  }
}

function cardEl(c){
  const el = document.createElement("div");
  el.className = "card";
  el.style.setProperty("--accent", c.accent);
  el.innerHTML = `
    <div class="card-bar"></div>
    <div class="ch"><span class="tt">${c.title}</span><span class="spacer"></span></div>
    <div class="cb">${bodyHTML(c.id)}</div>`;
  return el;
}

/* ===== 模式 1: Bento 平铺 ===== */
function renderBento(){
  const wrap = document.getElementById("mode-bento");
  wrap.innerHTML = "";
  const layout = [
    {id:"chart",col:1,row:1,w:8,h:4},
    {id:"radar",col:9,row:1,w:4,h:4},
    {id:"watch",col:1,row:5,w:6,h:2},
    {id:"spider",col:7,row:5,w:3,h:2},
    {id:"sectorevent",col:10,row:5,w:3,h:2},
  ];
  for(const l of layout){
    const c = CARDS.find(x=>x.id===l.id);
    const el = cardEl(c);
    el.style.gridColumn = `${l.col} / span ${l.w}`;
    el.style.gridRow = `${l.row} / span ${l.h}`;
    wrap.appendChild(el);
  }
}

/* ===== 模式 2: Master-Detail ===== */
let masterId = "chart";
function renderMaster(){
  const wrap = document.getElementById("mode-master");
  wrap.innerHTML = "";
  const master = CARDS.find(c=>c.id===masterId);
  const masterEl = document.createElement("div");
  masterEl.className = "master";
  const mcard = cardEl(master);
  mcard.style.position="absolute"; mcard.style.inset="0";
  masterEl.appendChild(mcard);
  wrap.appendChild(masterEl);

  const satEl = document.createElement("div");
  satEl.className = "satellites";
  for(const c of CARDS){
    const s = document.createElement("div");
    s.className = "sat" + (c.id===masterId?" on":"");
    s.style.setProperty("--accent",c.accent);
    const sc = cardEl(c);
    sc.style.position="absolute"; sc.style.inset="0";
    s.appendChild(sc);
    s.onclick = ()=>{ masterId = c.id; renderMaster(); };
    satEl.appendChild(s);
  }
  wrap.appendChild(satEl);
}

/* ===== 模式 3: 自由画布 ===== */
function renderCanvas(){
  const wrap = document.getElementById("mode-canvas");
  // 清掉旧卡片（保留 hint）
  wrap.querySelectorAll(".card").forEach(e=>e.remove());
  const positions = [
    {x:80,y:60,w:520,h:340},
    {x:640,y:80,w:360,h:260},
    {x:120,y:440,w:300,h:200},
    {x:460,y:440,w:320,h:200},
    {x:820,y:380,w:300,h:260},
  ];
  CARDS.forEach((c,i)=>{
    const p = positions[i];
    const el = cardEl(c);
    el.style.left = p.x+"px"; el.style.top = p.y+"px";
    el.style.width = p.w+"px"; el.style.height = p.h+"px";
    // 拖拽
    const ch = el.querySelector(".ch");
    ch.onpointerdown = (e)=>{
      const sx = e.clientX - el.offsetLeft;
      const sy = e.clientY - el.offsetTop;
      const move = (ev)=>{
        el.style.left = (ev.clientX - sx) + "px";
        el.style.top = (ev.clientY - sy) + "px";
      };
      const up = ()=>{
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
      };
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up);
    };
    wrap.appendChild(el);
  });
  // 画布平移
  wrap.onpointerdown = (e)=>{
    if(e.target.closest(".card")) return;
    const sx = e.clientX, sy = e.clientY;
    const cards = wrap.querySelectorAll(".card");
    const orig = [...cards].map(el=>({l:el.offsetLeft,t:el.offsetTop}));
    wrap.classList.add("dragging");
    const move = (ev)=>{
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      cards.forEach((el,i)=>{
        el.style.left = (orig[i].l + dx) + "px";
        el.style.top = (orig[i].t + dy) + "px";
      });
    };
    const up = ()=>{
      wrap.classList.remove("dragging");
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  };
}

/* ===== 模式 4: Deck 堆叠 ===== */
let deckIdx = 0;
function renderDeck(){
  const wrap = document.getElementById("mode-deck");
  wrap.innerHTML = `<div class="canvas-hint">点卡片翻到下一张 · 点空白看所有卡片背面</div>`;
  const stack = document.createElement("div");
  stack.className = "stack";
  // 按当前索引重排
  const ordered = [...CARDS.slice(deckIdx), ...CARDS.slice(0,deckIdx)];
  for(const c of ordered){
    stack.appendChild(cardEl(c));
  }
  wrap.appendChild(stack);

  const nav = document.createElement("div");
  nav.className = "deck-nav";
  nav.innerHTML = `<button id="prev">‹</button>
    <div class="dots">${CARDS.map((_,i)=>`<span class="dot ${i===deckIdx?"on":""}"></span>`).join("")}</div>
    <button id="next">›</button>`;
  wrap.appendChild(nav);
  nav.querySelector("#prev").onclick = ()=>{ deckIdx = (deckIdx-1+CARDS.length)%CARDS.length; renderDeck(); };
  nav.querySelector("#next").onclick = ()=>{ deckIdx = (deckIdx+1)%CARDS.length; renderDeck(); };
  // 点卡片翻下一张
  stack.onclick = ()=>{ deckIdx = (deckIdx+1)%CARDS.length; renderDeck(); };
  // hover 看背面
  stack.onmouseenter = ()=>stack.classList.add("peek");
  stack.onmouseleave = ()=>stack.classList.remove("peek");
}

/* ===== 模式切换 ===== */
const DESCS = {
  bento: "所有卡片同屏平铺，全景总览 —— 适合盘中一眼扫全市场",
  master: "一张主卡占大屏，右侧竖排卫星小卡 —— 点卫星卡升级为主卡，适合聚焦盯一只票",
  canvas: "卡片像 Figma/Miro 白板自由摆放，拖到任意位置 —— 适合自定义工作区、多窗对比",
  deck: "卡片像扑克牌叠起来，一次看一张 —— 适合小屏、专注单卡深度分析",
};
document.getElementById("modeTabs").onclick = (e)=>{
  const btn = e.target.closest(".mode");
  if(!btn) return;
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("on"));
  btn.classList.add("on");
  const m = btn.dataset.m;
  document.getElementById("modeDesc").textContent = DESCS[m];
  document.getElementById("mode-bento").classList.toggle("hidden", m!=="bento");
  document.getElementById("mode-master").classList.toggle("hidden", m!=="master");
  document.getElementById("mode-canvas").classList.toggle("hidden", m!=="canvas");
  document.getElementById("mode-deck").classList.toggle("hidden", m!=="deck");
  if(m==="bento") renderBento();
  if(m==="master") renderMaster();
  if(m==="canvas") renderCanvas();
  if(m==="deck") renderDeck();
};

renderBento();

// hash 切换模式：#m=master / canvas / deck
if(location.hash.includes("m=")){
  const m = location.hash.split("m=")[1];
  setTimeout(()=>{
    document.querySelector(`.mode[data-m="${m}"]`)?.click();
  },100);
}
</script>
</body>
</html>
