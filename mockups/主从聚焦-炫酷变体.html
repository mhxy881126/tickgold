<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TickGold · 主从聚焦炫酷变体</title>
<style>
:root{
  --bg:#05060a; --bg2:#0a0c12; --panel:#0e1118;
  --ink:#e8ecf1; --ink2:#8b94a3; --ink3:#565e6c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --up:#ff4d6a; --down:#00d4a0; --gold:#e8b860;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  font-feature-settings:"tnum";overflow:hidden}
.up{color:var(--up)} .down{color:var(--down)}
.app{height:100vh;display:flex;flex-direction:column}

.tbar{height:48px;flex:none;display:flex;align-items:center;padding:0 16px;gap:16px;
  border-bottom:1px solid var(--line);background:rgba(0,0,0,.3);z-index:20}
.logo{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:13px}
.variants{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:8px;border:1px solid var(--line)}
.vb{font-size:11.5px;padding:5px 14px;border-radius:6px;color:var(--ink2);cursor:pointer;border:0;background:transparent}
.vb.on{background:var(--gold);color:#000;font-weight:700}
.vb:not(.on):hover{color:var(--ink)}
.vdesc{margin-left:auto;font-size:11px;color:var(--ink3)}
.main{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(1000px 600px at 50% 40%, rgba(232,184,96,.04), transparent 60%), var(--bg2)}

/* 卡片基础 */
.card{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 22%),
             linear-gradient(180deg, #17130b, #120f08);
  border:1px solid var(--line);border-radius:10px;
  transition:box-shadow .25s, border-color .25s, transform .4s cubic-bezier(.22,1.2,.36,1)}
.card .card-bar{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent))}
.card .ch{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;
  font-size:11.5px;color:var(--ink);cursor:pointer;user-select:none;min-height:28px}
.card .ch .tt{font-weight:600;white-space:nowrap}
.card .cb{flex:1;padding:6px 12px 12px;overflow:hidden;position:relative;min-height:0}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;
  padding:3.5px 2px;border-bottom:1px dashed rgba(255,255,255,.04)}
.srow:last-child{border-bottom:0}
.srow .nm{color:var(--ink)} .srow .nm small{color:var(--ink3);margin-left:4px;font-size:9px;font-family:monospace}
.srow .pr{font-weight:600}
.hidden{display:none!important}

/* ============================================================
   变体 A: 曜石环绕 HUD
   ============================================================ */
#va{position:absolute;inset:0}
#va .master{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:620px;height:440px;z-index:5}
#va .master{border-color:var(--accent);
  box-shadow:0 0 0 1.5px var(--accent), 0 0 40px color-mix(in srgb,var(--accent) 35%,transparent), 0 30px 80px rgba(0,0,0,.7)}
#va .sat{position:absolute;width:240px;height:150px;cursor:pointer;z-index:3;
  opacity:.85}
#va .sat:hover{opacity:1;border-color:color-mix(in srgb,var(--accent) 60%,var(--line));
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 30%,transparent)}
#va .sat.on{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 0 20px color-mix(in srgb,var(--accent) 30%,transparent)}
/* HUD 切角装饰 */
#va .sat::before,#va .sat::after{content:"";position:absolute;width:10px;height:10px;
  border:1.5px solid var(--accent);opacity:.6}
#va .sat::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
#va .sat::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
/* 轨道连线 */
#va .orbit{position:absolute;inset:0;pointer-events:none;z-index:1}
#va .corner{position:absolute;width:14px;height:14px;color:var(--gold);font-size:10px;
  display:flex;align-items:center;justify-content:center;z-index:6;
  background:rgba(0,0,0,.6);border:1px solid var(--gold);border-radius:50%;font-weight:700}

/* ============================================================
   变体 B: 玻璃浮岛 Stage Manager
   ============================================================ */
#vb{position:absolute;inset:0}
#vb .master{position:absolute;left:24px;top:24px;right:280px;bottom:24px;z-index:5}
#vb .master{border-color:var(--accent);
  box-shadow:0 0 0 1.5px var(--accent), 0 0 40px color-mix(in srgb,var(--accent) 30%,transparent)}
#vb .rail{position:absolute;right:24px;top:24px;bottom:24px;width:240px;z-index:6;
  display:flex;flex-direction:column;gap:10px;transition:width .3s}
#vb .rail .sat{flex:1;position:relative;cursor:pointer;border-radius:10px;overflow:hidden;
  background:rgba(20,24,32,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);transition:all .25s}
#vb .rail .sat:hover{background:rgba(30,36,48,.7);border-color:rgba(232,184,96,.3)}
#vb .rail .sat.on{border-color:var(--accent);background:rgba(23,19,11,.85);
  box-shadow:0 0 0 1px var(--accent), 0 0 24px color-mix(in srgb,var(--accent) 30%,transparent)}
#vb .rail .sat .ch{font-size:11px}
#vb .rail .sat .cb{padding:4px 10px 8px}
#vb .rail .sat.mini .ch{padding:5px 8px 5px 10px}
#vb .rail .sat.mini .cb{display:none}
#vb .rail.collapsed .sat:not(.on){height:28px;flex:none}
#vb .rail.collapsed .sat:not(.on) .cb{display:none}
#vb .rail-toggle{position:absolute;right:24px;top:-38px;width:240px;height:28px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px 6px 0 0;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:10px;color:var(--ink3);cursor:pointer;z-index:7}
#vb .rail-toggle:hover{color:var(--gold)}

/* ============================================================
   变体 C: 轨道环绕 Orbit
   ============================================================ */
#vc{position:absolute;inset:0;cursor:default}
#vc .orbit-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:780px;height:560px;border:1px dashed rgba(232,184,96,.15);border-radius:50%;
  pointer-events:none}
#vc .master{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:540px;height:380px;z-index:10;
  border-color:var(--accent);
  box-shadow:0 0 0 1.5px var(--accent), 0 0 50px color-mix(in srgb,var(--accent) 40%,transparent), 0 30px 80px rgba(0,0,0,.8)}
#vc .sat{position:absolute;width:180px;height:120px;cursor:pointer;z-index:5;
  transition:all .5s cubic-bezier(.22,1.2,.36,1)}
#vc .sat:hover{transform:scale(1.05);border-color:var(--accent)}
#vc .sat .ch{font-size:10.5px;padding:4px 8px 4px 10px}
#vc .sat .cb{padding:4px 8px 8px;font-size:10px}
#vc .hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--ink3);z-index:20}
</style>
</head>
<body>
<div class="app">
  <div class="tbar">
    <span class="logo">TickGold</span>
    <div class="variants" id="varTabs">
      <button class="vb on" data-v="a">◉ 曜石环绕 HUD</button>
      <button class="vb" data-v="b">⬡ 玻璃浮岛</button>
      <button class="vb" data-v="c">◎ 轨道环绕</button>
    </div>
    <span class="vdesc" id="vdesc">主卡居中，卫星卡分布四角，金色轨道连线</span>
  </div>
  <div class="main">
    <div id="va"></div>
    <div id="vb" class="hidden"></div>
    <div id="vc" class="hidden"></div>
  </div>
</div>

<script>
const CARDS = [
  {id:"chart",title:"K线图",accent:"#2f6fed"},
  {id:"radar",title:"涨停雷达",accent:"#e0455a"},
  {id:"watch",title:"自选股",accent:"#26d07c"},
  {id:"spider",title:"短线精灵",accent:"#e0556b"},
  {id:"sectorevent",title:"板块异动",accent:"#e0556b"},
];
function bodyHTML(id, small){
  const s = small ? "font-size:10px" : "";
  switch(id){
    case "chart": return `
      <div style="font-size:${small?"12":"18"}px;font-weight:700;color:var(--up)">152.30 <span style="font-size:10px">+4.56%</span></div>
      <svg width="100%" height="80%" viewBox="0 0 400 200" preserveAspectRatio="none" style="margin-top:4px">
        <g stroke="#ff4d6a" fill="#ff4d6a">
          <line x1="40" y1="120" x2="40" y2="160"/><rect x="34" y="130" width="12" height="20"/>
          <line x1="140" y1="100" x2="140" y2="140"/><rect x="134" y="110" width="12" height="25"/>
          <line x1="240" y1="70" x2="240" y2="110"/><rect x="234" y="80" width="12" height="25"/>
          <line x1="340" y1="40" x2="340" y2="80"/><rect x="334" y="50" width="12" height="25"/>
        </g>
        <polyline points="40,150 140,130 240,100 340,70" fill="none" stroke="#e8b860" stroke-width="1.2"/>
      </svg>`;
    case "radar": return `
      <div class="srow"><span style="color:#e0455a;font-weight:700">5板</span><span class="nm">鸿博股份</span><span class="pr up">+10.02%</span></div>
      <div class="srow"><span style="color:#e0455a;font-weight:700">4板</span><span class="nm">拓维信息</span><span class="pr up">+10.00%</span></div>
      <div class="srow"><span style="color:#e0455a;font-weight:700">3板</span><span class="nm">四川长虹</span><span class="pr up">+9.98%</span></div>`;
    case "watch": return `
      <div class="srow"><span class="nm">贵州茅台<small>600519</small></span><span class="pr up">1685.00 +1.23%</span></div>
      <div class="srow"><span class="nm">中际旭创<small>300308</small></span><span class="pr up">152.30 +4.56%</span></div>
      <div class="srow"><span class="nm">宁德时代<small>300750</small></span><span class="pr down">187.45 -0.85%</span></div>`;
    case "spider": return `
      <div class="srow"><span class="nm"><span class="up">▲火箭</span> 中际旭创</span><span class="pr up">+4.56%</span></div>
      <div class="srow"><span class="nm"><span style="color:var(--gold)">●大买</span> 新易盛</span><span class="pr up">+3.88%</span></div>
      <div class="srow"><span class="nm"><span class="up">▲火箭</span> 天孚通信</span><span class="pr up">+3.21%</span></div>`;
    case "sectorevent": return `
      <div class="srow"><span class="nm"><span class="up">10:24 拉升</span> CPO 概念</span><span class="pr up">+3.12%</span></div>
      <div class="srow"><span class="nm"><span class="up">10:18 拉升</span> 算力租赁</span><span class="pr up">+2.44%</span></div>
      <div class="srow"><span class="nm"><span class="up">10:05 异动</span> 半导体设备</span><span class="pr up">+1.70%</span></div>`;
  }
}
function cardEl(c, small){
  const el = document.createElement("div");
  el.className = "card";
  el.style.setProperty("--accent", c.accent);
  el.innerHTML = `
    <div class="card-bar"></div>
    <div class="ch"><span class="tt">${c.title}</span></div>
    <div class="cb">${bodyHTML(c.id, small)}</div>`;
  return el;
}

/* ===== 变体 A: 曜石环绕 HUD ===== */
let masterA = "chart";
function renderA(){
  const wrap = document.getElementById("va");
  wrap.innerHTML = `<svg class="orbit" id="orbitSvg"></svg>`;
  const mc = CARDS.find(c=>c.id===masterA);
  const m = cardEl(mc);
  m.classList.add("master");
  wrap.appendChild(m);

  // 四角卫星
  const positions = [
    {x:30,y:30},              // 左上
    {x:"auto",right:30,y:30}, // 右上
    {x:30,bottom:30},         // 左下
    {x:"auto",right:30,bottom:30}, // 右下
  ];
  const others = CARDS.filter(c=>c.id!==masterA);
  others.forEach((c,i)=>{
    const s = cardEl(c, true);
    s.classList.add("sat");
    if(positions[i].x==="auto"){ s.style.right = positions[i].right+"px"; }
    else { s.style.left = positions[i].x+"px"; }
    if(positions[i].bottom!==undefined){ s.style.bottom = positions[i].bottom+"px"; }
    else { s.style.top = positions[i].y+"px"; }
    s.onclick = ()=>{ masterA = c.id; renderA(); };
    wrap.appendChild(s);
  });
  // 角标
  const corners = ["①","②","③","④"];
  corners.forEach((t,i)=>{
    const el = document.createElement("div");
    el.className = "corner"; el.textContent = t;
    if(i===0){ el.style.left="14px"; el.style.top="14px"; }
    if(i===1){ el.style.right="14px"; el.style.top="14px"; }
    if(i===2){ el.style.left="14px"; el.style.bottom="14px"; }
    if(i===3){ el.style.right="14px"; el.style.bottom="14px"; }
    wrap.appendChild(el);
  });
}

/* ===== 变体 B: 玻璃浮岛 ===== */
let masterB = "chart";
function renderB(){
  const wrap = document.getElementById("vb");
  wrap.innerHTML = "";
  const mc = CARDS.find(c=>c.id===masterB);
  const m = cardEl(mc);
  m.classList.add("master");
  wrap.appendChild(m);

  const rail = document.createElement("div");
  rail.className = "rail";
  rail.innerHTML = `<div class="rail-toggle" id="railToggle">⟨ 收起侧栏 ⟩</div>`;
  for(const c of CARDS){
    const s = cardEl(c, true);
    s.classList.add("sat");
    if(c.id===masterB) s.classList.add("on");
    s.onclick = ()=>{ masterB = c.id; renderB(); };
    rail.appendChild(s);
  }
  wrap.appendChild(rail);
  document.getElementById("railToggle").onclick = ()=>{
    rail.classList.toggle("collapsed");
    document.getElementById("railToggle").textContent =
      rail.classList.contains("collapsed") ? "⟩ 展开侧栏 ⟨" : "⟨ 收起侧栏 ⟩";
  };
}

/* ===== 变体 C: 轨道环绕 ===== */
let masterC = "chart";
function renderC(){
  const wrap = document.getElementById("vc");
  wrap.innerHTML = `<div class="hint">点任意卫星卡 → 它沿轨道飞入中央成为主卡</div><div class="orbit-ring"></div>`;
  const mc = CARDS.find(c=>c.id===masterC);
  const m = cardEl(mc);
  m.classList.add("master");
  wrap.appendChild(m);

  // 卫星沿椭圆轨道分布
  const others = CARDS.filter(c=>c.id!==masterC);
  // 椭圆上 4 个位置：左右上下
  const pos = [
    {x:"calc(50% - 390px)",y:"calc(50% - 60px)"},  // 左
    {x:"calc(50% + 210px)",y:"calc(50% - 60px)"},  // 右
    {x:"calc(50% - 90px)",y:"calc(50% - 280px)"},  // 上
    {x:"calc(50% - 90px)",y:"calc(50% + 160px)"},  // 下
  ];
  others.forEach((c,i)=>{
    const s = cardEl(c, true);
    s.classList.add("sat");
    s.style.left = pos[i].x;
    s.style.top = pos[i].y;
    s.onclick = ()=>{
      // FLIP: 记录旧位置
      const oldRect = s.getBoundingClientRect();
      masterC = c.id;
      renderC();
      // 新位置
      const newEl = wrap.querySelector(".master");
      const newRect = newEl.getBoundingClientRect();
      const dx = oldRect.left - newRect.left;
      const dy = oldRect.top - newRect.top;
      newEl.animate([
        { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${oldRect.width/newRect.width})` },
        { transform:`translate(-50%,-50%) scale(1)` }
      ], { duration:500, easing:"cubic-bezier(.22,1.2,.36,1)" });
    };
    wrap.appendChild(s);
  });
}

/* ===== 切换 ===== */
const DESCS = {
  a: "主卡居中，卫星卡分布四角，金色 HUD 切角 + 编号角标",
  b: "主卡占左区，右侧玻璃拟态浮岛栏，可折叠成窄条",
  c: "卫星卡沿椭圆轨道环绕主卡，点哪个沿轨道飞入中央",
};
document.getElementById("varTabs").onclick = (e)=>{
  const btn = e.target.closest(".vb");
  if(!btn) return;
  document.querySelectorAll(".vb").forEach(x=>x.classList.remove("on"));
  btn.classList.add("on");
  const v = btn.dataset.v;
  document.getElementById("vdesc").textContent = DESCS[v];
  document.getElementById("va").classList.toggle("hidden", v!=="a");
  document.getElementById("vb").classList.toggle("hidden", v!=="b");
  document.getElementById("vc").classList.toggle("hidden", v!=="c");
  if(v==="a") renderA();
  if(v==="b") renderB();
  if(v==="c") renderC();
};

renderA();
if(location.hash.includes("v=")){
  const v = location.hash.split("v=")[1];
  setTimeout(()=>document.querySelector(`.vb[data-v="${v}"]`)?.click(),100);
}
</script>
</body>
</html>
